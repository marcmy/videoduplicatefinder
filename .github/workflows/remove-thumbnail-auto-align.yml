name: Remove thumbnail auto-align

on:
  push:
    branches:
      - remove/thumbnail-auto-align
    paths:
      - .github/workflows/remove-thumbnail-auto-align.yml

permissions:
  contents: write

jobs:
  remove-auto-align:
    runs-on: ubuntu-latest
    steps:
      - name: Check out cleanup branch
        uses: actions/checkout@v4
        with:
          ref: remove/thumbnail-auto-align
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Remove thumbnail auto-align feature
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def read(path: str) -> str:
              return Path(path).read_text(encoding="utf-8")

          def write(path: str, text: str) -> None:
              Path(path).write_text(text, encoding="utf-8", newline="\n")

          def cut_between(text: str, start: str, end: str, path: str) -> str:
              start_index = text.find(start)
              if start_index < 0:
                  raise RuntimeError(f"{path}: start marker not found: {start!r}")
              end_index = text.find(end, start_index + len(start))
              if end_index < 0:
                  raise RuntimeError(f"{path}: end marker not found: {end!r}")
              return text[:start_index] + text[end_index:]

          def matching_brace(text: str, open_index: int) -> int:
              depth = 0
              state = "code"
              i = open_index
              while i < len(text):
                  c = text[i]
                  n = text[i + 1] if i + 1 < len(text) else ""
                  if state == "code":
                      if c == "/" and n == "/":
                          state = "line_comment"
                          i += 2
                          continue
                      if c == "/" and n == "*":
                          state = "block_comment"
                          i += 2
                          continue
                      if c == "@" and n == '"':
                          state = "verbatim_string"
                          i += 2
                          continue
                      if c in ("$", "@") and i + 2 < len(text) and text[i + 1:i + 3] in ('@"', '$"'):
                          state = "verbatim_string" if text[i + 1] == "@" else "string"
                          i += 3
                          continue
                      if c == '"':
                          state = "string"
                          i += 1
                          continue
                      if c == "'":
                          state = "char"
                          i += 1
                          continue
                      if c == "{":
                          depth += 1
                      elif c == "}":
                          depth -= 1
                          if depth == 0:
                              return i
                      i += 1
                      continue
                  if state == "line_comment":
                      if c == "\n":
                          state = "code"
                      i += 1
                      continue
                  if state == "block_comment":
                      if c == "*" and n == "/":
                          state = "code"
                          i += 2
                      else:
                          i += 1
                      continue
                  if state == "string":
                      if c == "\\":
                          i += 2
                      elif c == '"':
                          state = "code"
                          i += 1
                      else:
                          i += 1
                      continue
                  if state == "verbatim_string":
                      if c == '"' and n == '"':
                          i += 2
                      elif c == '"':
                          state = "code"
                          i += 1
                      else:
                          i += 1
                      continue
                  if state == "char":
                      if c == "\\":
                          i += 2
                      elif c == "'":
                          state = "code"
                          i += 1
                      else:
                          i += 1
              raise RuntimeError("Unmatched C# brace")

          def remove_method(text: str, method_name: str, path: str, include_attribute: bool = False) -> str:
              marker = method_name + "("
              name_index = text.find(marker)
              if name_index < 0:
                  raise RuntimeError(f"{path}: method not found: {method_name}")
              start = text.rfind("\n", 0, name_index) + 1
              if include_attribute:
                  attribute = text.rfind("\n\t[", 0, start)
                  if attribute >= 0 and start - attribute < 200:
                      start = attribute + 1
              open_index = text.find("{", name_index)
              if open_index < 0:
                  raise RuntimeError(f"{path}: opening brace not found for {method_name}")
              close_index = matching_brace(text, open_index)
              end = close_index + 1
              if end < len(text) and text[end] == "\r":
                  end += 1
              if end < len(text) and text[end] == "\n":
                  end += 1
              return text[:start] + text[end:]

          # Dedicated implementation and tests exist only for auto-align.
          for dead_file in (
              "VDF.Core/FFTools/FrameAlignment.cs",
              "VDF.Core.Tests/FFTools/FrameAlignmentTests.cs",
          ):
              path = Path(dead_file)
              if not path.exists():
                  raise RuntimeError(f"Expected auto-align file is missing: {dead_file}")
              path.unlink()

          # Remove the persisted setting. Old config files may still contain the key;
          # System.Text.Json will harmlessly ignore it after this property is gone.
          settings_path = "VDF.GUI/Data/SettingsFile.cs"
          settings = read(settings_path)
          settings, count = re.subn(
              r"\n\t\tbool _ThumbnailComparerAutoAlignFrames = true;.*?(?=\n\t\tbool _ShowThumbnailColumn =)",
              "",
              settings,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise RuntimeError(f"{settings_path}: failed to remove auto-align setting")
          write(settings_path, settings)

          # Remove localized UI strings from every locale that contains them.
          locale_hits = 0
          for locale_path in Path("VDF.GUI/Assets/Locales").glob("*.json"):
              lines = locale_path.read_text(encoding="utf-8").splitlines(keepends=True)
              filtered = [
                  line for line in lines
                  if '"ThumbnailComparerDialog.AutoAlign' not in line
              ]
              removed = len(lines) - len(filtered)
              if removed:
                  locale_hits += removed
                  locale_path.write_text("".join(filtered), encoding="utf-8", newline="\n")
          if locale_hits < 2:
              raise RuntimeError("Expected at least the English auto-align locale keys")

          # Remove the checkbox and busy indicator, retaining all manual frame controls.
          xaml_path = "VDF.GUI/Views/ThumbnailComparer.xaml"
          xaml = read(xaml_path)
          anchor = 'Path=[ThumbnailComparerDialog.AutoAlign]'
          anchor_index = xaml.find(anchor)
          if anchor_index < 0:
              raise RuntimeError(f"{xaml_path}: auto-align UI anchor not found")
          checkbox_start = xaml.rfind("<CheckBox", 0, anchor_index)
          border_start = xaml.rfind("<Border", 0, checkbox_start)
          progress_anchor = 'IsVisible="{Binding IsAutoAligning}"'
          progress_index = xaml.find(progress_anchor, anchor_index)
          if checkbox_start < 0 or border_start < 0 or progress_index < 0:
              raise RuntimeError(f"{xaml_path}: incomplete auto-align UI block")
          block_start = xaml.rfind("\n", 0, border_start)
          block_end = xaml.find("/>", progress_index)
          if block_end < 0:
              raise RuntimeError(f"{xaml_path}: progress bar end not found")
          xaml = xaml[:block_start] + xaml[block_end + 2:]
          write(xaml_path, xaml)

          # Remove the comparer orchestration while preserving manual A/B stepping,
          # stale-frame cancellation (#30), and normal offset-frame caching.
          vm_path = "VDF.GUI/ViewModels/ThumbnailComparerVM.cs"
          vm = read(vm_path)

          vm = cut_between(
              vm,
              "\n\t\tprivate bool _autoAlignFrames =",
              "\n\t\tprivate double _zoom",
              vm_path,
          )
          vm = cut_between(
              vm,
              "\n\t\tCancellationTokenSource? _autoAlignCts;",
              "\n\t\treadonly Func<Guid, bool, (Guid GroupId, List<LargeThumbnailDuplicateItem> Items)?>? _groupNavigator;",
              vm_path,
          )

          vm, count = re.subn(
              r"\n\t\t\tthis\.RaisePropertyChanged\(nameof\(CanAutoAlign\)\);\n\t\t\tif \(!CanAutoAlign\)\n\t\t\t\tCancelAutoAlign\(\);",
              "",
              vm,
              count=1,
          )
          if count != 1:
              raise RuntimeError(f"{vm_path}: CanAutoAlign cleanup block not found")

          # All remaining calls are side effects added solely to launch/cancel auto-align.
          vm = re.sub(r"^\s*RequestAutoAlign\(\);\n", "", vm, flags=re.M)
          vm = re.sub(r"^\s*CancelAutoAlign\(\);\n", "", vm, flags=re.M)

          vm = cut_between(
              vm,
              "\n\t\tvoid CancelAutoAlign()",
              "\n\t\tvoid Recalc()",
              vm_path,
          )

          vm, count = re.subn(
              r"\n\t\treadonly Dictionary<\(int, int, int\), byte\[\]\?> _alignmentGrayCache = new\(\);",
              "",
              vm,
              count=1,
          )
          if count != 1:
              raise RuntimeError(f"{vm_path}: alignment gray cache field not found")

          vm, count = re.subn(
              r"\n\t\t\t\tlock \(_alignmentGrayCache\)\n\t\t\t\t\t_alignmentGrayCache\.Clear\(\);",
              "",
              vm,
              count=1,
          )
          if count != 1:
              raise RuntimeError(f"{vm_path}: alignment gray cache clear not found")

          vm = cut_between(
              vm,
              "\n\t\tpublic bool TryGetCachedAlignmentGrayFrame(",
              "\n\t\tpublic Bitmap? ExtractFrameAtOffset(",
              vm_path,
          )

          if "Stopwatch" not in vm:
              vm = vm.replace("using System.Diagnostics;\n", "")

          for forbidden in (
              "AutoAlign",
              "FrameAlignment",
              "_alignmentGrayCache",
              "AlignmentGrayFrame",
          ):
              if forbidden in vm:
                  raise RuntimeError(f"{vm_path}: leftover auto-align symbol: {forbidden}")
          write(vm_path, vm)

          # Remove only the feature-specific batch grayscale API. Generic timeout,
          # stdout-draining, native-decoder, and scan gray-byte improvements remain.
          ffmpeg_path = "VDF.Core/FFTools/FfmpegEngine.cs"
          ffmpeg = read(ffmpeg_path)
          public_marker = "\n\t\tpublic static List<byte[]?> ExtractGrayFrames("
          method_index = ffmpeg.find(public_marker)
          if method_index < 0:
              raise RuntimeError(f"{ffmpeg_path}: ExtractGrayFrames not found")
          comments_index = ffmpeg.rfind("\n\t\t/// <summary>", 0, method_index)
          start_index = comments_index if comments_index >= 0 and method_index - comments_index < 800 else method_index
          end_marker = "\n\t\tpublic static List<byte[]?> ExtractThumbnailJpegs("
          end_index = ffmpeg.find(end_marker, method_index)
          if end_index < 0:
              raise RuntimeError(f"{ffmpeg_path}: ExtractThumbnailJpegs boundary not found")
          ffmpeg = ffmpeg[:start_index] + ffmpeg[end_index:]

          # PR #29 introduced this conversion helper for the removed batch API.
          # Keep it only if another current code path genuinely calls it.
          if ffmpeg.count("ExtractGrayBytesFromFrame(") == 1:
              ffmpeg = remove_method(ffmpeg, "ExtractGrayBytesFromFrame", ffmpeg_path)

          if "ExtractGrayFrames(" in ffmpeg or "TryExtractGrayFramesNative(" in ffmpeg:
              raise RuntimeError(f"{ffmpeg_path}: feature-specific gray extraction remains")
          write(ffmpeg_path, ffmpeg)

          integration_path = "VDF.IntegrationTests/FFTools/ThumbnailExtractionTests.cs"
          integration = read(integration_path)
          integration = remove_method(
              integration,
              "ExtractGrayFrames_ReturnsOneGray32BufferPerRequestedPosition",
              integration_path,
              include_attribute=True,
          )
          write(integration_path, integration)

          print("Removed thumbnail auto-align while preserving manual frame stepping and #30.")
          PY

      - name: Verify removal diff
        shell: bash
        run: |
          git diff --check
          if git grep -n -E 'AutoAlign|FrameAlignment|alignmentGray|AlignmentGrayFrame|ExtractGrayFrames' -- . ':(exclude).github/workflows/remove-thumbnail-auto-align.yml'; then
            echo 'Auto-align remnants remain.' >&2
            exit 1
          fi
          git diff --stat

      - name: Test core
        run: dotnet test VDF.Core.Tests/VDF.Core.Tests.csproj -c Release

      - name: Build GUI
        run: dotnet build VDF.GUI/VDF.GUI.csproj -c Release

      - name: Test FFtools integration
        run: dotnet test VDF.IntegrationTests/VDF.IntegrationTests.csproj -c Release --filter 'FullyQualifiedName~FFTools'

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'remove thumbnail comparer auto-align'
          git push origin HEAD:remove/thumbnail-auto-align
