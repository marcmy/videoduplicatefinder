name: Finalize 4.1 pHash quorum and comparer mode fixes

on:
  push:
    branches:
      - perf/4.1-native-hwaccel
    paths:
      - .github/workflows/port-41-phash-quorum.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
        with:
          ref: perf/4.1-native-hwaccel
          fetch-depth: 0

      - name: Fetch reference branch
        shell: pwsh
        run: git fetch origin perf/native-hwaccel-from-crashfix

      - name: Adapt pHash port to the current layouts
        shell: python
        run: |
          from pathlib import Path
          from textwrap import dedent

          path = Path('tools/port-41-phash-quorum.py')
          text = path.read_text(encoding='utf-8')

          if 'import re\n' not in text:
              text = text.replace('import subprocess\n', 'import subprocess\nimport re\n', 1)

          old_boundary = 'prop_end = old_gui_settings.index("\\t\\tbool _UseExifCreationDate", prop_start)'
          new_boundary = 'prop_end = old_gui_settings.index("\\t\\tdouble _PercentDurationDifference", prop_start)'
          if old_boundary in text:
              text = text.replace(old_boundary, new_boundary, 1)
          elif new_boundary not in text:
              raise RuntimeError('Could not locate the GUI pHash property extraction boundary.')

          text = text.replace('FormatString="\\{0\\}%"', 'FormatString="{}{0} %"')

          old_region = dedent('''
              old_start = old_scan.index("\\t\\tbool TryBuildCompareSnapshot")
              old_end = old_scan.index("\\t\\tinternal void ScanForDuplicates()", old_start)
              old_region = old_scan[old_start:old_end]
          ''').strip()
          new_region = dedent('''
              helper_match = re.search(r"\\n\\t\\t(?:internal\\s+)?(?:static\\s+)?bool\\s+TryGetOrComputePHash\\s*\\(", old_scan)
              if helper_match is None:
                  raise RuntimeError("TryGetOrComputePHash helper was not found in the reference branch")
              helper_start = helper_match.start() + 1
              brace_start = old_scan.index("{", helper_match.end())
              depth = 0
              helper_end = None
              for i in range(brace_start, len(old_scan)):
                  if old_scan[i] == "{":
                      depth += 1
                  elif old_scan[i] == "}":
                      depth -= 1
                      if depth == 0:
                          helper_end = i + 1
                          break
              if helper_end is None:
                  raise RuntimeError("Could not determine the end of TryGetOrComputePHash")

              old_start = old_scan.index("\\t\\tbool TryBuildCompareSnapshot")
              old_end = old_scan.index("\\t\\tinternal void ScanForDuplicates()", old_start)
              old_region = old_scan[helper_start:helper_end] + "\\n\\n" + old_scan[old_start:old_end]
          ''').strip()
          if old_region not in text:
              raise RuntimeError('Could not locate the pHash matcher extraction block in the port script.')
          text = text.replace(old_region, new_region, 1)
          path.write_text(text, encoding='utf-8')

      - name: Apply pHash quorum port
        shell: pwsh
        run: python tools/port-41-phash-quorum.py

      - name: Fix comparer mode fallback and add regression test
        shell: python
        run: |
          from pathlib import Path
          from textwrap import dedent

          vm_path = Path('VDF.GUI/ViewModels/ThumbnailComparerVM.cs')
          vm = vm_path.read_text(encoding='utf-8')

          helper = dedent('''
              \t\tinternal static bool ShouldForceSingleView(CompareMode mode, bool hasSelectionA, bool hasSelectionB) =>
              \t\t\tmode != CompareMode.Single && (!hasSelectionA || !hasSelectionB);

          ''').lstrip()
          anchor = '\t\t// Auto-fallback to Single when only one image is available. Must not write to\n'
          if 'ShouldForceSingleView(' not in vm:
              if vm.count(anchor) != 1:
                  raise RuntimeError(f'Expected one comparer fallback anchor, found {vm.count(anchor)}')
              vm = vm.replace(anchor, helper + anchor, 1)

          old = 'if (SelectedCompareMode != CompareMode.Single && (ImageA is null || ImageB is null))'
          new = 'if (ShouldForceSingleView(SelectedCompareMode, SelectedItemA is not null, SelectedItemB is not null))'
          if old in vm:
              vm = vm.replace(old, new, 1)
          elif new not in vm:
              raise RuntimeError('Could not locate the comparer auto-fallback condition.')
          vm_path.write_text(vm, encoding='utf-8')

          test_path = Path('VDF.GUI.Tests/ThumbnailComparerModeTests.cs')
          test_path.write_text(dedent('''
              // Copyright (C) 2026 0x90d
              // SPDX-License-Identifier: AGPL-3.0-or-later

              using VDF.GUI.ViewModels;

              namespace VDF.GUI.Tests;

              public class ThumbnailComparerModeTests {
              \t[Theory]
              \t[InlineData(CompareMode.Single, false, false, false)]
              \t[InlineData(CompareMode.Single, true, true, false)]
              \t[InlineData(CompareMode.Swipe, true, true, false)]
              \t[InlineData(CompareMode.SideBySide, true, true, false)]
              \t[InlineData(CompareMode.Stacked, true, true, false)]
              \t[InlineData(CompareMode.Swipe, true, false, true)]
              \t[InlineData(CompareMode.SideBySide, false, true, true)]
              \tpublic void DualModesDependOnSelections_NotBitmapLoadTiming(
              \t\tCompareMode mode, bool hasA, bool hasB, bool expected) =>
              \t\tAssert.Equal(expected, ThumbnailComparerVM.ShouldForceSingleView(mode, hasA, hasB));
              }
          ''').lstrip(), encoding='utf-8')

      - name: Build GUI
        shell: pwsh
        run: dotnet build VDF.GUI/VDF.GUI.csproj -c Release -v minimal

      - name: Run Core tests
        shell: pwsh
        run: dotnet test VDF.Core.Tests/VDF.Core.Tests.csproj -c Release -v normal

      - name: Run GUI tests
        shell: pwsh
        run: dotnet test VDF.GUI.Tests/VDF.GUI.Tests.csproj -c Release -v normal

      - name: Commit validated fixes
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          foreach ($path in @(
            'tools/port-41-comparer-correctness.py',
            'tools/phash-port-failure.log',
            'tools/phash-build-failure.log',
            'tools/port-41-phash-quorum.py'
          )) {
            if (Test-Path $path) { git rm $path }
          }

          git add VDF.Core/Settings.cs
          git add VDF.Core/ScanEngine.cs
          git add VDF.Core.Tests/PHashSampleQuorumTests.cs
          git add VDF.GUI/Data/SettingsFile.cs
          git add VDF.GUI/ViewModels/MainWindowVM.cs
          git add VDF.GUI/ViewModels/ThumbnailComparerVM.cs
          git add VDF.GUI/Views/SettingsView.xaml
          git add VDF.GUI/Assets/Locales
          git add VDF.GUI.Tests/ThumbnailComparerModeTests.cs
          git add docs/4.1-perf-port.md
          git commit -m 'fix: restore pHash quorum and comparer mode selection on 4.1'
          git push origin HEAD:perf/4.1-native-hwaccel
