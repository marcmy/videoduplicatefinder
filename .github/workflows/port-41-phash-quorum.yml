name: Apply 4.1 pHash sample quorum port

on:
  push:
    branches:
      - perf/4.1-native-hwaccel
    paths:
      - .github/workflows/port-41-phash-quorum.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
        with:
          ref: perf/4.1-native-hwaccel
          fetch-depth: 0

      - name: Fetch reference branch
        shell: pwsh
        run: git fetch origin perf/native-hwaccel-from-crashfix

      - name: Adapt port script to current settings layout
        shell: python
        run: |
          from pathlib import Path
          path = Path('tools/port-41-phash-quorum.py')
          text = path.read_text(encoding='utf-8')
          old = 'prop_end = old_gui_settings.index("\\t\\tbool _UseExifCreationDate", prop_start)'
          new = 'prop_end = old_gui_settings.index("\\t\\tdouble _PercentDurationDifference", prop_start)'
          if text.count(old) != 1:
              raise RuntimeError(f'expected one old GUI property boundary, found {text.count(old)}')
          text = text.replace(old, new, 1)
          text = text.replace('FormatString="\\{0\\}%"', 'FormatString="{}{0} %"')
          path.write_text(text, encoding='utf-8')

      - name: Apply pHash quorum port
        id: port
        shell: pwsh
        run: |
          python tools/port-41-phash-quorum.py *> port.log
          $code = $LASTEXITCODE
          Get-Content port.log
          "code=$code" >> $env:GITHUB_OUTPUT
          exit 0

      - name: Persist exact port failure
        if: steps.port.outputs.code != '0'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force tools | Out-Null
          Copy-Item port.log tools/phash-port-failure.log -Force
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f tools/phash-port-failure.log
          git commit -m 'diagnostics: capture pHash port failure'
          git push origin HEAD:perf/4.1-native-hwaccel
          exit 1

      - name: Build GUI
        if: steps.port.outputs.code == '0'
        shell: pwsh
        run: dotnet build VDF.GUI/VDF.GUI.csproj -c Release -v q

      - name: Run Core tests
        if: steps.port.outputs.code == '0'
        shell: pwsh
        run: dotnet test VDF.Core.Tests/VDF.Core.Tests.csproj -c Release -v q

      - name: Run GUI tests
        if: steps.port.outputs.code == '0'
        shell: pwsh
        run: dotnet test VDF.GUI.Tests/VDF.GUI.Tests.csproj -c Release -v q

      - name: Commit validated pHash port
        if: steps.port.outputs.code == '0'
        shell: pwsh
        run: |
          if (Test-Path tools/port-41-comparer-correctness.py) {
            git rm tools/port-41-comparer-correctness.py
          }
          if (Test-Path tools/phash-port-failure.log) {
            git rm tools/phash-port-failure.log
          }
          git rm tools/port-41-phash-quorum.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add VDF.Core/Settings.cs
          git add VDF.Core/ScanEngine.cs
          git add VDF.Core.Tests/PHashSampleQuorumTests.cs
          git add VDF.GUI/Data/SettingsFile.cs
          git add VDF.GUI/ViewModels/MainWindowVM.cs
          git add VDF.GUI/Views/SettingsView.xaml
          git add VDF.GUI/Assets/Locales
          git add docs/4.1-perf-port.md
          git commit -m 'perf: restore multi-sample pHash matching quorum on 4.1'
          git push origin HEAD:perf/4.1-native-hwaccel
