name: Fix perf merge conflict

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/fix-perf-merge-conflict.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-perf-merge-conflict
  cancel-in-progress: false

jobs:
  fix:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Resolve perf merge conflict'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout perf branch
        uses: actions/checkout@v5
        with:
          ref: perf/native-hwaccel-from-crashfix
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge master and resolve decoder conflict
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin master
          git fetch origin perf/native-hwaccel-from-crashfix
          git checkout perf/native-hwaccel-from-crashfix

          before="$(git rev-parse HEAD)"

          set +e
          git merge --no-edit --no-commit origin/master
          merge_status=$?
          set -e

          # The perf branch owns its workflow definitions. Keep those and do not
          # copy this one-shot repair workflow into the perf branch.
          git checkout "$before" -- .github/workflows
          git rm -f --ignore-unmatch .github/workflows/fix-perf-merge-conflict.yml
          git add .github/workflows

          if [ "$merge_status" -ne 0 ]; then
            target='VDF.Core/FFTools/FFmpegNative/VideoStreamDecoder.cs'
            conflicted_files="$(git diff --name-only --diff-filter=U)"
            printf 'Conflicted files:\n%s\n' "$conflicted_files"

            if [ "$conflicted_files" != "$target" ]; then
              echo 'Unexpected conflict set; refusing an unsafe automatic resolution.'
              exit 1
            fi

            # Start with the perf implementation, then integrate master's two
            # still-image fixes: do not seek at position zero, and drain the
            # decoder after demuxer EOF so buffered MJPEG frames are emitted.
            git checkout --ours -- "$target"

            python3 <<'PY'
          from pathlib import Path

          path = Path('VDF.Core/FFTools/FFmpegNative/VideoStreamDecoder.cs')
          text = path.read_text(encoding='utf-8')

          old_seek = (
              "\t\t\tlong targetPts = ToStreamPts(position);\n"
              "\t\t\tSeekTo(targetPts, out long seekMs);"
          )
          new_seek = (
              "\t\t\tlong targetPts = ToStreamPts(position);\n"
              "\t\t\tlong seekMs = 0;\n"
              "\t\t\t// Seeking to zero can overshoot the sole packet in single-frame image\n"
              "\t\t\t// demuxers. Decode forward from the start for position zero instead.\n"
              "\t\t\tif (targetPts > 0)\n"
              "\t\t\t\tSeekTo(targetPts, out seekMs);"
          )
          if text.count(old_seek) != 1:
              raise SystemExit('Expected single-frame seek block was not found exactly once.')
          text = text.replace(old_seek, new_seek, 1)

          start_marker = "\t\t\tconst int maxBadPackets = 64;\n"
          end_marker = "\n\t\t\tlong decodeMs = decodeSw.ElapsedMilliseconds;"
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('Expected single-frame decode-loop markers were not found.')

          merged_loop = (
              "\t\t\tconst int maxBadPackets = 64;\n"
              "\t\t\tint badPacketCount = 0;\n"
              "\t\t\t// Once the demuxer is exhausted, flush the decoder once so buffered\n"
              "\t\t\t// intra frames (notably single-frame MJPEG images) can be received.\n"
              "\t\t\tbool draining = false;\n"
              "\t\t\tfor (int iter = 0; iter < maxIterations; iter++) {\n"
              "\t\t\t\tif (!draining) {\n"
              "\t\t\t\t\tint error;\n"
              "\t\t\t\t\twhile (true) {\n"
              "\t\t\t\t\t\tffmpeg.av_packet_unref(_pPacket);\n"
              "\t\t\t\t\t\tResetTimeout();\n"
              "\t\t\t\t\t\terror = ffmpeg.av_read_frame(_pFormatContext, _pPacket);\n"
              "\t\t\t\t\t\tif (error == ffmpeg.AVERROR_EOF) {\n"
              "\t\t\t\t\t\t\tffmpeg.av_packet_unref(_pPacket);\n"
              "\t\t\t\t\t\t\tResetTimeout();\n"
              "\t\t\t\t\t\t\tffmpeg.avcodec_send_packet(_pCodecContext, null).ThrowExceptionIfError(\"avcodec_send_packet(NULL) while draining single frame\");\n"
              "\t\t\t\t\t\t\tdraining = true;\n"
              "\t\t\t\t\t\t\tbreak;\n"
              "\t\t\t\t\t\t}\n"
              "\t\t\t\t\t\tif (error == ffmpeg.AVERROR_INVALIDDATA) {\n"
              "\t\t\t\t\t\t\tif (++badPacketCount > maxBadPackets) {\n"
              "\t\t\t\t\t\t\t\tframe = *_pFrame;\n"
              "\t\t\t\t\t\t\t\ttiming = new DecodedFrameTiming(seekMs, decodeSw.ElapsedMilliseconds, 0, 0);\n"
              "\t\t\t\t\t\t\t\treturn false;\n"
              "\t\t\t\t\t\t\t}\n"
              "\t\t\t\t\t\t\tcontinue;\n"
              "\t\t\t\t\t\t}\n"
              "\t\t\t\t\t\terror.ThrowExceptionIfError(\"av_read_frame while decoding single frame\");\n"
              "\t\t\t\t\t\tif (_pPacket->stream_index == _streamIndex) break;\n"
              "\t\t\t\t\t}\n"
              "\n"
              "\t\t\t\t\tif (!draining) {\n"
              "\t\t\t\t\t\tint sendErr;\n"
              "\t\t\t\t\t\ttry {\n"
              "\t\t\t\t\t\t\tResetTimeout();\n"
              "\t\t\t\t\t\t\tsendErr = ffmpeg.avcodec_send_packet(_pCodecContext, _pPacket);\n"
              "\t\t\t\t\t\t}\n"
              "\t\t\t\t\t\tfinally {\n"
              "\t\t\t\t\t\t\tffmpeg.av_packet_unref(_pPacket);\n"
              "\t\t\t\t\t\t}\n"
              "\t\t\t\t\t\tif (sendErr == ffmpeg.AVERROR_INVALIDDATA || sendErr == ffmpeg.AVERROR(ffmpeg.EINVAL)) {\n"
              "\t\t\t\t\t\t\tif (++badPacketCount > maxBadPackets) {\n"
              "\t\t\t\t\t\t\t\tframe = *_pFrame;\n"
              "\t\t\t\t\t\t\t\ttiming = new DecodedFrameTiming(seekMs, decodeSw.ElapsedMilliseconds, 0, 0);\n"
              "\t\t\t\t\t\t\t\treturn false;\n"
              "\t\t\t\t\t\t\t}\n"
              "\t\t\t\t\t\t\tcontinue;\n"
              "\t\t\t\t\t\t}\n"
              "\t\t\t\t\t\tsendErr.ThrowExceptionIfError(\"avcodec_send_packet while decoding single frame\");\n"
              "\t\t\t\t\t}\n"
              "\t\t\t\t}\n"
              "\n"
              "\t\t\t\tResetTimeout();\n"
              "\t\t\t\tint recvErr = ffmpeg.avcodec_receive_frame(_pCodecContext, _pFrame);\n"
              "\t\t\t\tif (recvErr == ffmpeg.AVERROR(ffmpeg.EAGAIN)) {\n"
              "\t\t\t\t\tif (draining) {\n"
              "\t\t\t\t\t\tframe = *_pFrame;\n"
              "\t\t\t\t\t\ttiming = new DecodedFrameTiming(seekMs, decodeSw.ElapsedMilliseconds, 0, 0);\n"
              "\t\t\t\t\t\treturn false;\n"
              "\t\t\t\t\t}\n"
              "\t\t\t\t\tcontinue;\n"
              "\t\t\t\t}\n"
              "\t\t\t\tif (recvErr == ffmpeg.AVERROR_EOF) {\n"
              "\t\t\t\t\tframe = *_pFrame;\n"
              "\t\t\t\t\ttiming = new DecodedFrameTiming(seekMs, decodeSw.ElapsedMilliseconds, 0, 0);\n"
              "\t\t\t\t\treturn false;\n"
              "\t\t\t\t}\n"
              "\t\t\t\tif (recvErr < 0)\n"
              "\t\t\t\t\trecvErr.ThrowExceptionIfError(\"avcodec_receive_frame while decoding single frame\");\n"
              "\n"
              "\t\t\t\tif (FrameSatisfiesTarget(GetFrameTimestamp(_pFrame), targetPts)) {\n"
              "\t\t\t\t\tfoundTargetFrame = true;\n"
              "\t\t\t\t\tbreak;\n"
              "\t\t\t\t}\n"
              "\n"
              "\t\t\t\tffmpeg.av_frame_unref(_pFrame);\n"
              "\t\t\t}\n"
          )
          text = text[:start] + merged_loop + text[end:]
          path.write_text(text, encoding='utf-8', newline='')
          PY

            git add "$target"

            remaining="$(git diff --name-only --diff-filter=U)"
            if [ -n "$remaining" ]; then
              printf 'Unresolved conflicts remain:\n%s\n' "$remaining"
              exit 1
            fi
          fi

          if ! git rev-parse -q --verify MERGE_HEAD >/dev/null; then
            echo 'Expected an in-progress merge, but MERGE_HEAD is absent.'
            exit 1
          fi

          git commit --no-edit
          git push origin HEAD:perf/native-hwaccel-from-crashfix
