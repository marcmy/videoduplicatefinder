name: Patch AI compatibility seek parity

on:
  push:
    branches:
      - agent/fix-ai-h264-reference-seeks
    paths:
      - '.github/workflows/patch-ai-compat-seek.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/fix-ai-h264-reference-seeks
          fetch-depth: 0

      - name: Restore compatibility helper fast seek
        shell: python
        run: |
          from pathlib import Path

          path = Path("VDF.Core/FFTools/FfmpegEngine.AiCompat.cs")
          text = path.read_text(encoding="utf-8")
          old = '''\t\t\tbool isImage = FileUtils.IsImageFile(file);
          \t\t\tpsi.ArgumentList.Add("-i");
          \t\t\tpsi.ArgumentList.Add(FFToolsUtils.LongPathFix(file));
          \t\t\tif (!isImage) {
          \t\t\t\t// Compatibility callers prioritize correctness over fast input seeking.
          \t\t\t\t// Output-side seeking decodes the reference chain before selecting the frame.
          \t\t\t\tpsi.ArgumentList.Add("-ss");
          \t\t\t\tpsi.ArgumentList.Add(position.ToString(null, CultureInfo.InvariantCulture));
          \t\t\t}
          '''
          new = '''\t\t\tbool isImage = FileUtils.IsImageFile(file);
          \t\t\tif (!isImage) {
          \t\t\t\tpsi.ArgumentList.Add("-ss");
          \t\t\t\tpsi.ArgumentList.Add(position.ToString(null, CultureInfo.InvariantCulture));
          \t\t\t}
          \t\t\tpsi.ArgumentList.Add("-i");
          \t\t\tpsi.ArgumentList.Add(FFToolsUtils.LongPathFix(file));
          '''
          if old not in text:
              raise SystemExit("Expected compatibility seek block was not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")

      - name: Commit patch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add VDF.Core/FFTools/FfmpegEngine.AiCompat.cs
          git commit -m "Preserve combined CLI frame parity"
          git push origin HEAD:agent/fix-ai-h264-reference-seeks
