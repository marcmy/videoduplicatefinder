name: Repair perf FFmpeg diagnostics merge

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/repair-perf-ffmpeg-diagnostics.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: repair-perf-ffmpeg-diagnostics
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout perf branch
        uses: actions/checkout@v5
        with:
          ref: perf/native-hwaccel-from-crashfix
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge master and port diagnostics
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin master
          git fetch origin perf/native-hwaccel-from-crashfix
          git show origin/master:.github/scripts/repair_perf_ffmpeg_diagnostics.py > "$RUNNER_TEMP/repair.py"

          git checkout perf/native-hwaccel-from-crashfix
          before="$(git rev-parse HEAD)"

          set +e
          git merge --no-edit --no-commit origin/master
          merge_status=$?
          set -e

          git checkout "$before" -- .github/workflows
          git rm -f --ignore-unmatch \
            .github/workflows/repair-perf-ffmpeg-diagnostics.yml \
            .github/workflows/dispatch-perf-diagnostics-repair.yml \
            .github/scripts/repair_perf_ffmpeg_diagnostics.py
          git add .github/workflows .github/scripts 2>/dev/null || true

          if [ "$merge_status" -ne 0 ]; then
            target='VDF.Core/FFTools/FfmpegEngine.cs'
            conflicted="$(git diff --name-only --diff-filter=U)"
            printf 'Conflicted files:\n%s\n' "$conflicted"

            if [ "$conflicted" != "$target" ]; then
              echo 'Unexpected conflict set; refusing an unsafe automatic resolution.'
              exit 1
            fi

            git checkout --ours -- "$target"
            python3 "$RUNNER_TEMP/repair.py"
            git add "$target"

            remaining="$(git diff --name-only --diff-filter=U)"
            if [ -n "$remaining" ]; then
              printf 'Unresolved conflicts remain:\n%s\n' "$remaining"
              exit 1
            fi
          fi

          git diff --cached --check
          git commit --no-edit

      - name: Test FFmpeg diagnostic integration
        shell: bash
        run: |
          set -euo pipefail
          dotnet test ./VDF.Core.Tests/VDF.Core.Tests.csproj -c Release \
            --filter 'FullyQualifiedName~FfmpegErrorClassifierTests|FullyQualifiedName~FfmpegLogCaptureTests'

      - name: Push repaired perf branch
        run: git push origin HEAD:perf/native-hwaccel-from-crashfix

      - name: Dispatch perf release build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run releases.yml --repo "${{ github.repository }}" --ref perf/native-hwaccel-from-crashfix

      - name: Remove temporary repair files
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            .github/workflows/repair-perf-ffmpeg-diagnostics.yml \
            .github/workflows/dispatch-perf-diagnostics-repair.yml \
            .github/scripts/repair_perf_ffmpeg_diagnostics.py
          do
            encoded="${file//\//%2F}"
            sha="$(gh api "repos/$REPO/contents/$encoded?ref=master" --jq .sha 2>/dev/null || true)"
            if [ -n "$sha" ]; then
              gh api --method DELETE "repos/$REPO/contents/$encoded" \
                -f message='Remove temporary perf diagnostics repair files' \
                -f sha="$sha" \
                -f branch='master'
            fi
          done
