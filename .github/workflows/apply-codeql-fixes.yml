name: Apply CodeQL fixes

on:
  push:
    branches:
      - fix/codeql-security-alerts
    paths:
      - .github/workflows/apply-codeql-fixes.yml

permissions:
  contents: write

jobs:
  apply-fixes:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/codeql-security-alerts

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Apply security fixes
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import re

          def read_normalized(path: Path) -> tuple[str, str]:
              raw = path.read_bytes()
              newline = "\r\n" if b"\r\n" in raw else "\n"
              return raw.decode("utf-8").replace("\r\n", "\n"), newline

          def write_preserving_newlines(path: Path, text: str, newline: str) -> None:
              path.write_bytes(text.replace("\n", newline).encode("utf-8"))

          def replace_once(path_str: str, old: str, new: str) -> None:
              path = Path(path_str)
              text, newline = read_normalized(path)
              if text.count(old) != 1:
                  raise RuntimeError(f"Expected exactly one match in {path}, found {text.count(old)}")
              write_preserving_newlines(path, text.replace(old, new, 1), newline)

          def replace_zip_extractor(path_str: str) -> None:
              path = Path(path_str)
              text, newline = read_normalized(path)
              pattern = re.compile(
                  r"(?ms)^(?P<indent>\t+)static void SafeExtractZip\(string archivePath, string targetFolder\) \{\n"
                  r".*?^(?P=indent)\}"
              )
              matches = list(pattern.finditer(text))
              if len(matches) != 1:
                  raise RuntimeError(f"Expected exactly one SafeExtractZip method in {path}, found {len(matches)}")
              indent = matches[0].group("indent")
              replacement = (
                  f"{indent}static void SafeExtractZip(string archivePath, string targetFolder) {{\n"
                  f"{indent}\tZipFile.ExtractToDirectory(archivePath, targetFolder, overwriteFiles: true);\n"
                  f"{indent}}}"
              )
              write_preserving_newlines(path, pattern.sub(replacement, text, count=1), newline)

          replace_zip_extractor("VDF.Web/Services/FFmpegSetupService.cs")
          replace_zip_extractor("VDF.GUI/ViewModels/MainWindowVM_FfmpegDownloader.cs")

          auth_path = Path("VDF.Web/Services/AuthService.cs")
          auth, auth_newline = read_normalized(auth_path)

          cookie_anchor = "\t\t\t\tSameSite = SameSiteMode.Strict,\n"
          if auth.count(cookie_anchor) != 1:
              raise RuntimeError("Could not locate the auth cookie SameSite setting")
          auth = auth.replace(
              cookie_anchor,
              cookie_anchor + "\t\t\t\tSecure = true,\n",
              1,
          )

          logged_secret = "\t\t\t_logger.LogInformation(\"  Web UI password:  {Password}\", _password);\n"
          if auth.count(logged_secret) != 1:
              raise RuntimeError("Could not locate the password logging statement")
          auth = auth.replace(
              logged_secret,
              "\t\t\t_logger.LogInformation(\"  Web UI authentication is enabled.\");\n",
              1,
          )
          auth = auth.replace(
              "\t\t\t// Log via ILogger so it shows up in VS Code Debug Console / structured logging\n",
              "\t\t\t// Never send the password through ILogger because providers may persist structured logs.\n",
              1,
          )
          write_preserving_newlines(auth_path, auth, auth_newline)

          workflow_path = Path(".github/workflows/dotnetcore.yml")
          workflow, workflow_newline = read_normalized(workflow_path)
          jobs_anchor = "\njobs:\n"
          if workflow.count(jobs_anchor) != 1:
              raise RuntimeError("Could not locate jobs section in dotnetcore.yml")
          workflow = workflow.replace(
              jobs_anchor,
              "\npermissions:\n  contents: read\n" + jobs_anchor,
              1,
          )
          write_preserving_newlines(workflow_path, workflow, workflow_newline)
          '@ | python -

      - name: Verify builds
        shell: pwsh
        run: |
          dotnet build VDF.Web/VDF.Web.csproj -c Release --nologo
          dotnet build VDF.GUI/VDF.GUI.csproj -c Release --nologo

      - name: Commit fixes
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VDF.Web/Services/FFmpegSetupService.cs VDF.GUI/ViewModels/MainWindowVM_FfmpegDownloader.cs VDF.Web/Services/AuthService.cs .github/workflows/dotnetcore.yml
          git commit -m "Fix CodeQL security findings"
          git push origin HEAD:fix/codeql-security-alerts
