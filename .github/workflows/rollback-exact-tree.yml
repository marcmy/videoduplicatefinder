name: Restore requested VDF tree

on:
  push:
    branches:
      - revert/to-a4aaf-native-state

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: revert/to-a4aaf-native-state
          fetch-depth: 0

      - name: Restore target snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git read-tree --reset -u a4aaf71997de211d8b352b6d4c1e2dde569385f8
          git commit -m "revert: restore tree from a4aaf719"
          git push origin HEAD:revert/to-a4aaf-native-state
