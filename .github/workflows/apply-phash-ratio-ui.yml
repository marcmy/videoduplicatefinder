name: Apply pHash ratio UI patch

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/apply-phash-ratio-ui.yml'

permissions:
  contents: write
  actions: write

jobs:
  patch-perf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout perf branch
        uses: actions/checkout@v5
        with:
          ref: perf/native-hwaccel-from-crashfix
          fetch-depth: 0

      - name: Patch pHash ratio setting/UI
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f"Pattern not found in {path}:\n{old}")
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace(
              'VDF.Core/Settings.cs',
              '\t\tpublic float Percent = 96f;\n',
              '\t\tpublic float Percent = 96f;\n\t\t/// <summary>Minimum ratio of video sample positions that must individually pass the pHash similarity threshold. Default 0.60.</summary>\n\t\tpublic float PHashRequiredMatchingSampleRatio = 0.6f;\n'
          )

          replace(
              'VDF.Core/ScanEngine.cs',
              '\t\tconst float pHashRequiredMatchingSampleRatio = 0.6f;\n',
              ''
          )

          replace(
              'VDF.Core/ScanEngine.cs',
              '\t\t\t\tint requiredMatchingSamples = Math.Max(1, (int)Math.Ceiling(sampleCount * pHashRequiredMatchingSampleRatio));\n',
              '\t\t\t\tfloat requiredSampleRatio = Math.Clamp(Settings.PHashRequiredMatchingSampleRatio, 0.01f, 1f);\n\t\t\t\tint requiredMatchingSamples = Math.Max(1, (int)Math.Ceiling(sampleCount * requiredSampleRatio));\n'
          )

          replace(
              'VDF.GUI/Data/SettingsFile.cs',
              '''\t\tfloat _Percent = 95f;\n\t\t[JsonPropertyName("Percent")]\n\t\tpublic float Percent {\n\t\t\tget => _Percent;\n\t\t\tset => this.RaiseAndSetIfChanged(ref _Percent, value);\n\t\t}\n''',
              '''\t\tfloat _Percent = 95f;\n\t\t[JsonPropertyName("Percent")]\n\t\tpublic float Percent {\n\t\t\tget => _Percent;\n\t\t\tset => this.RaiseAndSetIfChanged(ref _Percent, value);\n\t\t}\n\t\tfloat _PHashRequiredMatchingSampleRatioPercent = 60f;\n\t\t[JsonPropertyName("PHashRequiredMatchingSampleRatioPercent")]\n\t\tpublic float PHashRequiredMatchingSampleRatioPercent {\n\t\t\tget => _PHashRequiredMatchingSampleRatioPercent;\n\t\t\tset => this.RaiseAndSetIfChanged(ref _PHashRequiredMatchingSampleRatioPercent, Math.Clamp(value, 1f, 100f));\n\t\t}\n'''
          )

          replace(
              'VDF.GUI/ViewModels/MainWindowVM.cs',
              '\t\t\tScanner.Settings.Percent = SettingsFile.Instance.Percent;\n',
              '\t\t\tScanner.Settings.Percent = SettingsFile.Instance.Percent;\n\t\t\tScanner.Settings.PHashRequiredMatchingSampleRatio = SettingsFile.Instance.PHashRequiredMatchingSampleRatioPercent / 100f;\n'
          )

          replace(
              'VDF.GUI/Views/MainWindow.xaml',
              '''                                                                    ToolTip.Tip="{Binding Source={x:Static local:App.Lang}, Path=[MainWindow.Settings.PercentTooltip]}"\n                                                                    Value="{Binding Source={x:Static Settings:SettingsFile.Instance}, Path=Percent}" />\n''',
              '''                                                                    ToolTip.Tip="{Binding Source={x:Static local:App.Lang}, Path=[MainWindow.Settings.PercentTooltip]}"\n                                                                    Value="{Binding Source={x:Static Settings:SettingsFile.Instance}, Path=Percent}" />\n                                                    <TextBlock Margin="0,4,0,0" Text="Required pHash sample matches"\n                                                               ToolTip.Tip="For videos using pHash, this percent of sampled positions must individually pass the similarity threshold. Default: 60%." />\n                                                    <NumericUpDown Width="200" HorizontalAlignment="Left" FormatString="\\{0\\}%"\n                                                                   Increment="1" Maximum="100" Minimum="1"\n                                                                   IsEnabled="{Binding Source={x:Static Settings:SettingsFile.Instance}, Path=UsePHash}"\n                                                                   ToolTip.Tip="Lower catches more edited duplicates but may increase false positives. Higher is stricter. With 5 thumbnails, 60% requires 3 matching samples."\n                                                                   Value="{Binding Source={x:Static Settings:SettingsFile.Instance}, Path=PHashRequiredMatchingSampleRatioPercent}" />\n'''
          )
          PY

      - name: Commit and push perf branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git diff -- VDF.Core/Settings.cs VDF.Core/ScanEngine.cs VDF.GUI/Data/SettingsFile.cs VDF.GUI/ViewModels/MainWindowVM.cs VDF.GUI/Views/MainWindow.xaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VDF.Core/Settings.cs VDF.Core/ScanEngine.cs VDF.GUI/Data/SettingsFile.cs VDF.GUI/ViewModels/MainWindowVM.cs VDF.GUI/Views/MainWindow.xaml
          git commit -m "Expose pHash sample match ratio setting"
          git push origin HEAD:perf/native-hwaccel-from-crashfix
          gh workflow run releases.yml --repo marcmy/videoduplicatefinder --ref perf/native-hwaccel-from-crashfix
