name: Windows 64-bit

on:
  pull_request:
    paths-ignore:
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  build:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v5
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'
    - name: Build GUI
      run: dotnet publish VDF.GUI/VDF.GUI.csproj -c Release -v q --self-contained -r win-x64
    - name: Build CLI
      run: dotnet publish VDF.CLI/VDF.CLI.csproj -c Release -v q --self-contained -r win-x64
    - name: Build Web
      run: dotnet publish VDF.Web/VDF.Web.csproj -c Release -v q --self-contained -r win-x64
    - name: Run Unit Tests
      run: dotnet test VDF.Core.Tests/VDF.Core.Tests.csproj -c Release -v q --logger "trx;LogFileName=core-tests.trx" --results-directory TestResults/Core
    - name: Run CLI Tests
      run: dotnet test VDF.CLI.Tests/VDF.CLI.Tests.csproj -c Release -v q --logger "trx;LogFileName=cli-tests.trx" --results-directory TestResults/CLI
    - name: Install FFmpeg
      run: choco install ffmpeg -y --no-progress
    - name: Run Integration Tests
      run: dotnet test VDF.IntegrationTests/VDF.IntegrationTests.csproj -c Release -v normal --logger "trx;LogFileName=integration-tests.trx" --results-directory TestResults/Integration
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: windows-test-results
        path: TestResults/**/*.trx
        if-no-files-found: warn
        retention-days: 7
