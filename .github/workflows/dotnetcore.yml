name: Fix release concurrency isolation

on:
  pull_request:
    branches:
      - perf/native-hwaccel-from-crashfix

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/release-concurrency-isolation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/release-concurrency-isolation
          fetch-depth: 0

      - name: Patch release concurrency and restore workflow
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/releases.yml')
          text = path.read_text(encoding='utf-8')
          old = """concurrency:
            group: build-releases
            cancel-in-progress: true"""
          open_expr = '$' + '{{'
          close_expr = '}}'
          expression = (
              "github.event_name == 'pull_request' "
              "&& format('build-releases-pr-{0}', github.event.pull_request.number) "
              "|| 'build-releases-release'"
          )
          new = (
              "concurrency:\n"
              f"  group: {open_expr} {expression} {close_expr}\n"
              "  cancel-in-progress: true"
          )
          if old not in text:
              raise SystemExit('Expected concurrency block was not found.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          git fetch origin perf/native-hwaccel-from-crashfix
          git checkout origin/perf/native-hwaccel-from-crashfix -- .github/workflows/dotnetcore.yml

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/releases.yml .github/workflows/dotnetcore.yml
          git commit -m 'Isolate PR and release concurrency groups'
          git push origin HEAD:fix/release-concurrency-isolation
