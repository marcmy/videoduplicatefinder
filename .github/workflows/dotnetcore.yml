name: Fix release concurrency isolation

on:
  push:
    branches:
      - fix/release-concurrency-isolation

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/release-concurrency-isolation
          fetch-depth: 0

      - name: Patch release concurrency and restore workflow
        shell: pwsh
        run: |
          $path = '.github/workflows/releases.yml'
          $text = Get-Content -LiteralPath $path -Raw
          $old = @'
          concurrency:
            group: build-releases
            cancel-in-progress: true
          '@
          $new = @'
          concurrency:
            group: ${{ github.event_name == 'pull_request' && format('build-releases-pr-{0}', github.event.pull_request.number) || 'build-releases-release' }}
            cancel-in-progress: true
          '@
          if (!$text.Contains($old)) {
              throw 'Expected concurrency block was not found.'
          }
          Set-Content -LiteralPath $path -Value ($text.Replace($old, $new)) -Encoding utf8

          git fetch origin perf/native-hwaccel-from-crashfix
          git checkout origin/perf/native-hwaccel-from-crashfix -- .github/workflows/dotnetcore.yml

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/releases.yml .github/workflows/dotnetcore.yml
          git commit -m 'Isolate PR and release concurrency groups'
          git push origin HEAD:fix/release-concurrency-isolation
