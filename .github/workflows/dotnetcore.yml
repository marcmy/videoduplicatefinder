name: Windows 64-bit

on:
  pull_request:
    # Workflow-only PRs (action bumps) skip the build, except a change to this file,
    # which is tested by running it.
    paths:
      - '**'
      - '!.github/workflows/**'
      - '.github/workflows/dotnetcore.yml'

permissions:
  contents: read

jobs:
  build:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'
    - name: Build GUI
      run: dotnet publish VDF.GUI/VDF.GUI.csproj -c Release -v q --self-contained -r win-x64
    - name: Build CLI
      run: dotnet publish VDF.CLI/VDF.CLI.csproj -c Release -v q --self-contained -r win-x64
    - name: Build Web
      run: dotnet publish VDF.Web/VDF.Web.csproj -c Release -v q --self-contained -r win-x64
    - name: Run Unit Tests
      run: dotnet test VDF.Core.Tests/VDF.Core.Tests.csproj -c Release -v q --logger "console;verbosity=minimal"
    - name: Run CLI Tests
      run: dotnet test VDF.CLI.Tests/VDF.CLI.Tests.csproj -c Release -v q --logger "console;verbosity=minimal"
    - name: Run GUI Tests
      run: dotnet test VDF.GUI.Tests/VDF.GUI.Tests.csproj -c Release -v q --logger "console;verbosity=minimal"
    - name: Run GUI Headless Tests
      run: dotnet test VDF.GUI.HeadlessTests/VDF.GUI.HeadlessTests.csproj -c Release -v q --logger "console;verbosity=minimal"
    - name: Run Web Tests
      run: dotnet test VDF.Web.Tests/VDF.Web.Tests.csproj -c Release -v q --logger "console;verbosity=minimal"
    # The same verified shared build as the release workflow: with the shared libraries the
    # native-binding integration tests run instead of skipping (Chocolatey has none).
    - name: Install shared FFmpeg 8.1
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $version = '8.1'
        $archive = "ffmpeg-n$version-latest-win64-gpl-shared-$version.zip"
        $baseUrl = 'https://github.com/BtbN/FFmpeg-Builds/releases/download/latest'
        $zipPath = Join-Path $env:RUNNER_TEMP $archive
        $extractRoot = Join-Path $env:RUNNER_TEMP 'vdf-ffmpeg-shared'
        $checksumPath = Join-Path $env:RUNNER_TEMP 'ffmpeg-checksums.sha256'

        curl.exe --fail --location --retry 3 --retry-delay 2 "$baseUrl/$archive" --output $zipPath
        if ($LASTEXITCODE -ne 0) { throw "Failed to download $archive" }
        curl.exe --fail --location --retry 3 --retry-delay 2 "$baseUrl/checksums.sha256" --output $checksumPath
        if ($LASTEXITCODE -ne 0) { throw 'Failed to download BtbN checksums.sha256' }

        $checksumLine = Get-Content $checksumPath |
          Where-Object { $_ -match "\s+$([Regex]::Escape($archive))\s*$" } |
          Select-Object -First 1
        if (!$checksumLine) { throw "No checksum entry found for $archive" }
        $expected = ($checksumLine -split '\s+')[0].ToLowerInvariant()
        $actual = (Get-FileHash -LiteralPath $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
        if ($actual -ne $expected) {
          throw "FFmpeg archive checksum mismatch: expected $expected, got $actual"
        }

        if (Test-Path $extractRoot) { Remove-Item $extractRoot -Recurse -Force }
        Expand-Archive -LiteralPath $zipPath -DestinationPath $extractRoot -Force
        $ffmpeg = Get-ChildItem $extractRoot -Filter ffmpeg.exe -File -Recurse | Select-Object -First 1
        $ffprobe = Get-ChildItem $extractRoot -Filter ffprobe.exe -File -Recurse | Select-Object -First 1
        if (!$ffmpeg -or !$ffprobe) { throw 'Shared archive did not contain ffmpeg.exe and ffprobe.exe' }
        if ($ffmpeg.DirectoryName -ne $ffprobe.DirectoryName) { throw 'ffmpeg.exe and ffprobe.exe were not co-located' }

        $bin = $ffmpeg.DirectoryName
        foreach ($dll in @('avcodec-62.dll', 'avformat-62.dll', 'avutil-60.dll', 'swscale-9.dll', 'swresample-6.dll')) {
          if (!(Test-Path (Join-Path $bin $dll) -PathType Leaf)) {
            throw "Shared FFmpeg build is missing required native library: $dll"
          }
        }

        $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        "VDF_TEST_SHARED_FFMPEG_BIN=$bin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        Write-Host "Using verified shared FFmpeg from $bin"
    - name: Run Integration Tests
      run: dotnet test VDF.IntegrationTests/VDF.IntegrationTests.csproj -c Release -v normal
