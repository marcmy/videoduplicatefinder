name: Windows 64-bit

on:
  workflow_dispatch:
  pull_request:
    # Workflow-only PRs (action bumps) skip the build, except a change to this file,
    # which is tested by running it.
    paths:
      - '**'
      - '!.github/workflows/**'
      - '.github/workflows/dotnetcore.yml'

permissions:
  contents: read

jobs:
  build:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v7
    - name: Test reviewed sync resolutions
      run: python -m unittest discover -s .github/scripts -p test_resolve_reviewed_sync_conflicts.py -v
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: |
          10.0.x
          11.0.x
    - name: Build GUI
      run: dotnet publish VDF.GUI/VDF.GUI.csproj -c Release -v q --self-contained -r win-x64
    - name: Validate GUI win-x64 Native AOT publish
      run: dotnet publish VDF.GUI/VDF.GUI.csproj -c Release -v q -p:PublishAot=true -r win-x64 -o onnx-aot-smoke
    - name: Build CLI
      run: dotnet publish VDF.CLI/VDF.CLI.csproj -c Release -v q --self-contained -r win-x64
    - name: Build Web
      run: dotnet publish VDF.Web/VDF.Web.csproj -c Release -v q --self-contained -r win-x64
    - name: Run Unit Tests
      run: dotnet test VDF.Core.Tests/VDF.Core.Tests.csproj -c Release -v q --logger "console;verbosity=minimal"
    - name: Smoke test downloaded ONNX DirectML 1.24.4 native runtime
      env:
        VDF_TEST_ONNX_DOWNLOAD: '1'
      run: dotnet test VDF.Core.Tests/VDF.Core.Tests.csproj -c Release -v q --filter "FullyQualifiedName~DownloadedNativeRuntime_ExecutesModel_OptIn" --logger "console;verbosity=minimal"
    - name: Run CLI Tests
      run: dotnet test VDF.CLI.Tests/VDF.CLI.Tests.csproj -c Release -v q --logger "console;verbosity=minimal"
    - name: Run GUI Tests
      run: dotnet test VDF.GUI.Tests/VDF.GUI.Tests.csproj -c Release -v q --logger "console;verbosity=minimal"
    - name: Run GUI Headless Tests
      run: dotnet test VDF.GUI.HeadlessTests/VDF.GUI.HeadlessTests.csproj -c Release -v q --logger "console;verbosity=minimal"
    - name: Run Web Tests
      run: dotnet test VDF.Web.Tests/VDF.Web.Tests.csproj -c Release -v q --logger "console;verbosity=minimal"
    # The same verified shared build as the release workflow: with the shared libraries the
    # native-binding integration tests run instead of skipping (Chocolatey has none).
    - name: Install shared FFmpeg matching the binding
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $project = [xml](Get-Content VDF.Core/VDF.Core.csproj -Raw)
        $binding = $project.SelectSingleNode("//PackageReference[@Include='FFmpeg.AutoGen']")
        if (!$binding) { throw 'FFmpeg.AutoGen package reference is missing.' }
        switch ($binding.GetAttribute('Version').Split('.')[0]) {
          '8' {
            $version = '8.1'
            $nativeLibraries = @('avcodec-62.dll', 'avformat-62.dll', 'avutil-60.dll', 'swscale-9.dll', 'swresample-6.dll')
          }
          '9' {
            $version = '9.0'
            $nativeLibraries = @('avcodec-63.dll', 'avformat-63.dll', 'avutil-61.dll', 'swscale-10.dll', 'swresample-7.dll')
          }
          default { throw 'No verified shared FFmpeg fixture is configured for this binding major.' }
        }
        $archive = "ffmpeg-n$version-latest-win64-gpl-shared-$version.zip"
        $baseUrl = 'https://github.com/FFmpeg-Builds/FFmpeg-Builds/releases/download/latest'
        $zipPath = Join-Path $env:RUNNER_TEMP $archive
        $extractRoot = Join-Path $env:RUNNER_TEMP 'vdf-ffmpeg-shared'
        $checksumPath = Join-Path $env:RUNNER_TEMP 'ffmpeg-checksums.sha256'

        curl.exe --fail --location --retry 3 --retry-delay 2 "$baseUrl/$archive" --output $zipPath
        if ($LASTEXITCODE -ne 0) { throw "Failed to download $archive" }
        curl.exe --fail --location --retry 3 --retry-delay 2 "$baseUrl/checksums.sha256" --output $checksumPath
        if ($LASTEXITCODE -ne 0) { throw 'Failed to download BtbN checksums.sha256' }

        $checksumLine = Get-Content $checksumPath |
          Where-Object { $_ -match "\s+$([Regex]::Escape($archive))\s*$" } |
          Select-Object -First 1
        if (!$checksumLine) { throw "No checksum entry found for $archive" }
        $expected = ($checksumLine -split '\s+')[0].ToLowerInvariant()
        $actual = (Get-FileHash -LiteralPath $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
        if ($actual -ne $expected) {
          throw "FFmpeg archive checksum mismatch: expected $expected, got $actual"
        }

        if (Test-Path $extractRoot) { Remove-Item $extractRoot -Recurse -Force }
        Expand-Archive -LiteralPath $zipPath -DestinationPath $extractRoot -Force
        $ffmpeg = Get-ChildItem $extractRoot -Filter ffmpeg.exe -File -Recurse | Select-Object -First 1
        $ffprobe = Get-ChildItem $extractRoot -Filter ffprobe.exe -File -Recurse | Select-Object -First 1
        if (!$ffmpeg -or !$ffprobe) { throw 'Shared archive did not contain ffmpeg.exe and ffprobe.exe' }
        if ($ffmpeg.DirectoryName -ne $ffprobe.DirectoryName) { throw 'ffmpeg.exe and ffprobe.exe were not co-located' }

        $bin = $ffmpeg.DirectoryName
        foreach ($dll in $nativeLibraries) {
          if (!(Test-Path (Join-Path $bin $dll) -PathType Leaf)) {
            throw "Shared FFmpeg build is missing required native library: $dll"
          }
        }

        $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        "VDF_TEST_SHARED_FFMPEG_BIN=$bin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        Write-Host "Using verified shared FFmpeg from $bin"
    - name: Run Integration Tests
      run: dotnet test VDF.IntegrationTests/VDF.IntegrationTests.csproj -c Release -v normal

    # This is a PR-only experimental artifact, NOT a 4.1 production release.
    # The GUI and CLI use the opt-in FP16 model only through bundled launchers.
    - name: Publish ONNX test CLI
      if: github.head_ref == 'feat/onnx132-cuda-validation' || github.ref_name == 'feat/onnx132-cuda-validation'
      run: dotnet publish VDF.CLI/VDF.CLI.csproj -c Release -v q --self-contained -r win-x64 -o onnx-test-cli

    - name: Package ONNX FP16 experimental test build
      if: github.head_ref == 'feat/onnx132-cuda-validation' || github.ref_name == 'feat/onnx132-cuda-validation'
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        if (!(Test-Path onnx-aot-smoke/VDF.GUI.exe -PathType Leaf)) {
          throw 'Native AOT GUI executable missing from ONNX test build.'
        }
        if (!(Test-Path onnx-test-cli/vdf-cli.exe -PathType Leaf)) {
          throw 'CLI executable missing from ONNX test build.'
        }
        $root = 'onnx-test-package'
        New-Item -ItemType Directory -Path "$root/GUI","$root/CLI" -Force | Out-Null
        Copy-Item onnx-aot-smoke/* "$root/GUI/" -Recurse -Force
        Copy-Item onnx-test-cli/* "$root/CLI/" -Recurse -Force
        foreach ($path in @('scripts/ai-test-build/Launch-AiTest.ps1',
            'scripts/ai-test-build/Launch-FP16-CUDA.cmd',
            'scripts/ai-test-build/Launch-INT8-DirectML.cmd',
            'scripts/ai-test-build/Compare-PublicAiFullScans.ps1',
            'scripts/ai-test-build/New-ShareableAiPartialCorpus.ps1',
            'scripts/ai-test-build/Compare-PublicAiPartialScans.ps1',
            'scripts/ai-test-build/Initialize-VdfCudaDependencies.ps1',
            'scripts/New-ShareableAiCorpus.ps1',
            'docs/ONNX_TEST_BUILD.md')) {
          Copy-Item $path $root -Force
        }
        Get-ChildItem $root -Recurse -File |
          Where-Object { $_.Extension -in '.pdb', '.dbg' } |
          Remove-Item -Force
        # Parse every shipped PowerShell script before publishing a test build.
        foreach ($script in (Get-ChildItem $root -Filter '*.ps1' -File)) {
          $tokens = $null
          $parseErrors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            $script.FullName, [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count -gt 0) {
            throw "PowerShell syntax errors in $($script.Name): $($parseErrors -join '; ')"
          }
        }
        Compress-Archive -Path "$root/*" -DestinationPath VDF-ONNX-FP16-Test-win-x64.zip -Force
        if ((Get-Item VDF-ONNX-FP16-Test-win-x64.zip).Length -le 0) {
          throw 'Experimental test build ZIP is empty.'
        }

    - name: Upload ONNX FP16 experimental test ZIP
      if: github.head_ref == 'feat/onnx132-cuda-validation' || github.ref_name == 'feat/onnx132-cuda-validation'
      uses: actions/upload-artifact@v7
      with:
        name: vdf-onnx-fp16-experimental-win-x64
        path: VDF-ONNX-FP16-Test-win-x64.zip
        retention-days: 14
        if-no-files-found: error
