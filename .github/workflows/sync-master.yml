name: Sync master from upstream

on:
  workflow_dispatch:
  schedule:
    - cron: "11 */6 * * *"

permissions:
  contents: write

concurrency:
  group: sync-master
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout master
        uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.vdf_sync_token }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream and fetch
        run: |
          git remote add upstream https://github.com/0x90d/videoduplicatefinder.git || true
          git fetch origin
          git fetch upstream

      - name: Merge upstream/master into master
        run: |
          git checkout master

          set +e
          git merge --no-edit upstream/master
          merge_status=$?
          set -e

          if [ "$merge_status" -ne 0 ]; then
            echo "Merge reported conflicts. Preserving fork-owned workflow files, then checking for remaining conflicts."

            conflicted_files=$(git diff --name-only --diff-filter=U)
            echo "$conflicted_files"

            echo "$conflicted_files" | while IFS= read -r file; do
              if [ -n "$file" ] && [[ "$file" == .github/workflows/* ]]; then
                echo "Keeping fork version of $file"
                git checkout --ours -- "$file"
                git add "$file"
              fi
            done

            remaining_conflicts=$(git diff --name-only --diff-filter=U)
            if [ -n "$remaining_conflicts" ]; then
              echo "Unresolved non-workflow conflicts remain:"
              echo "$remaining_conflicts"
              exit 1
            fi

            git commit --no-edit
          fi

      - name: Push master
        run: |
          git push origin master
