name: Sync master from upstream

on:
  workflow_dispatch:
  schedule:
    - cron: "11 */6 * * *"

permissions:
  contents: write

concurrency:
  group: sync-master
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout master
        uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream and fetch
        run: |
          git remote add upstream https://github.com/0x90d/videoduplicatefinder.git || true
          git fetch origin
          git fetch upstream

      - name: Merge upstream/master into master
        shell: bash
        run: |
          set -euo pipefail
          git checkout master
          before="$(git rev-parse HEAD)"

          set +e
          git merge --no-edit --no-commit --no-ff upstream/master
          merge_status=$?
          set -e

          # This fork owns its workflow definitions. Restore the exact pre-merge
          # workflow tree even when upstream adds, removes, or cleanly changes files.
          git rm -r -f --ignore-unmatch .github/workflows
          git checkout "$before" -- .github/workflows
          git add .github/workflows

          if [ "$merge_status" -ne 0 ]; then
            echo "Merge reported conflicts. Fork-owned workflows were restored; checking for remaining source conflicts."
            remaining_conflicts="$(git diff --name-only --diff-filter=U)"

            if [ -n "$remaining_conflicts" ]; then
              echo "Unresolved non-workflow conflicts remain:"
              echo "$remaining_conflicts"
              exit 1
            fi
          fi

          if git rev-parse -q --verify MERGE_HEAD >/dev/null; then
            git commit --no-edit
          fi

          if ! git diff --quiet "$before" HEAD -- .github/workflows; then
            echo "::error::.github/workflows changed during upstream sync"
            git diff --stat "$before" HEAD -- .github/workflows
            exit 1
          fi

      - name: Push master
        run: |
          git push origin master
