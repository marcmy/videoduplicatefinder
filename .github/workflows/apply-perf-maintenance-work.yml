name: Apply staged perf maintenance

on:
  pull_request:
    branches:
      - perf/4.1-native-hwaccel
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

concurrency:
  group: apply-staged-perf-maintenance
  cancel-in-progress: true

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'automation/perf-maintenance-work'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: automation/perf-maintenance-work
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Configure git
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Apply deterministic source transformation
        run: python tools/apply-perf-maintenance.py

      - name: Validate builds and tests
        id: validate
        continue-on-error: true
        shell: pwsh
        run: |
          $log = 'perf-maintenance-validation.log'
          function Invoke-Logged([scriptblock] $Command) {
            & $Command 2>&1 | Tee-Object -FilePath $log -Append
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          Invoke-Logged { dotnet build VDF.GUI/VDF.GUI.csproj -c Release -v q }
          Invoke-Logged { dotnet build VDF.CLI/VDF.CLI.csproj -c Release -v q }
          Invoke-Logged { dotnet build VDF.Benchmarks/VDF.Benchmarks.csproj -c Release -v q }
          Invoke-Logged { dotnet test VDF.Core.Tests/VDF.Core.Tests.csproj -c Release -v q }
          Invoke-Logged { dotnet test VDF.GUI.Tests/VDF.GUI.Tests.csproj -c Release -v q }
          Invoke-Logged { dotnet test VDF.CLI.Tests/VDF.CLI.Tests.csproj -c Release -v q }

      - name: Upload validation failure
        if: steps.validate.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: perf-maintenance-validation
          path: perf-maintenance-validation.log
          if-no-files-found: error
          retention-days: 1

      - name: Fail after preserving validation log
        if: steps.validate.outcome == 'failure'
        run: exit 1

      - name: Commit validated transformation
        if: steps.validate.outcome == 'success'
        shell: bash
        run: |
          git add VDF.Core/FFTools/FfmpegEngine.cs \
            VDF.Core/FFTools/FfmpegEngine.NativeHealth.cs \
            VDF.Core/FFTools/FfmpegEngine.Telemetry.cs \
            VDF.Core/FFTools/FfmpegEngine.HardwarePolicy.cs \
            VDF.Core.Tests/FFTools/FfmpegEngineTests.cs
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Transformation already committed.'
          else
            git commit -m "refactor: split FFmpeg engine and gate success telemetry"
            git push origin HEAD:automation/perf-maintenance-work
          fi
