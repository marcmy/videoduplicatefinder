name: Execute thumbnail auto-align removal

on:
  pull_request:
    branches:
      - perf/native-hwaccel-from-crashfix
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  remove-auto-align:
    if: github.head_ref == 'remove/thumbnail-auto-align'
    runs-on: ubuntu-latest
    steps:
      - name: Check out cleanup branch
        uses: actions/checkout@v4
        with:
          ref: remove/thumbnail-auto-align
          fetch-depth: 0
          persist-credentials: true

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Execute staged cleanup script
        shell: bash
        run: |
          python3 <<'BOOT'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/remove-thumbnail-auto-align.yml').read_text(encoding='utf-8')
          start_marker = "          python3 <<'PY'\n"
          end_marker = "\n          PY\n"
          if start_marker not in workflow or end_marker not in workflow:
              raise RuntimeError('Unable to locate staged cleanup script')
          script = workflow.split(start_marker, 1)[1].split(end_marker, 1)[0]
          exec(compile(textwrap.dedent(script), 'remove-thumbnail-auto-align.py', 'exec'))
          BOOT

      - name: Verify removal diff
        shell: bash
        run: |
          git diff --check
          if git grep -n -E 'AutoAlign|FrameAlignment|alignmentGray|AlignmentGrayFrame|ExtractGrayFrames' -- . ':(exclude).github/workflows/remove-thumbnail-auto-align.yml' ':(exclude).github/workflows/execute-thumbnail-auto-align-removal.yml'; then
            echo 'Auto-align remnants remain.' >&2
            exit 1
          fi
          git diff --stat

      - name: Test core
        run: dotnet test VDF.Core.Tests/VDF.Core.Tests.csproj -c Release

      - name: Build GUI
        run: dotnet build VDF.GUI/VDF.GUI.csproj -c Release

      - name: Test FFtools integration
        run: dotnet test VDF.IntegrationTests/VDF.IntegrationTests.csproj -c Release --filter 'FullyQualifiedName~FFTools'

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'remove thumbnail comparer auto-align'
          git push origin HEAD:remove/thumbnail-auto-align
