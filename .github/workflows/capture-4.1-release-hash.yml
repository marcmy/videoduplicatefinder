name: Capture 4.1 release hash

on:
  push:
    branches:
      - perf/4.1-native-hwaccel
    paths:
      - .github/workflows/capture-4.1-release-hash.yml

permissions:
  contents: read
  pull-requests: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: perf/4.1-native-hwaccel

      - name: Download published GUI asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download 4.1.x --pattern GUI-win-x64.zip --clobber

      - name: Report SHA-256
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          hash="$(sha256sum GUI-win-x64.zip | awk '{print $1}')"
          gh pr comment 56 --body "4.1 perf release SHA-256: \`$hash\`"
