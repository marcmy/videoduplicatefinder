name: Refresh 4.1 perf branch

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - .github/workflows/refresh-patched-branch.yml

permissions:
  contents: read
  actions: write

concurrency:
  group: refresh-4.1-perf-branch
  cancel-in-progress: true

jobs:
  dispatch-maintenance:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch staged maintenance workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo 'Dispatching structurally robust maintenance patch.'
          gh workflow run apply-perf-maintenance.yml --repo marcmy/videoduplicatefinder --ref master
