name: Refresh 4.1 perf branch
# Permanent workflow restored after perf-maintenance validation.
# pHash quorum compatibility is reapplied deterministically after each merge.

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Sync master from upstream
    types:
      - completed
  push:
    branches:
      - master
    paths:
      - .github/workflows/refresh-patched-branch.yml

permissions:
  contents: write
  actions: write

concurrency:
  group: refresh-4.1-perf-branch
  cancel-in-progress: true

jobs:
  refresh:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: windows-latest

    steps:
      - name: Checkout 4.1 perf branch
        uses: actions/checkout@v5
        with:
          ref: perf/4.1-native-hwaccel
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch origin branches
        run: |
          git fetch origin master
          git fetch origin perf/4.1-native-hwaccel

      - name: Merge fork master into 4.1 perf branch
        id: merge
        shell: bash
        run: |
          set -euo pipefail
          branch='perf/4.1-native-hwaccel'
          git checkout "$branch"
          before="$(git rev-parse HEAD)"

          set +e
          git merge --no-edit --no-commit origin/master
          merge_status=$?
          set -e

          # The performance branch owns its workflow definitions. Keep them across
          # upstream refreshes so default-token pushes never need workflow scope.
          git checkout "$before" -- .github/workflows
          git add .github/workflows

          if [ "$merge_status" -ne 0 ]; then
            echo 'Merge reported conflicts. Auto-resolving only known safe files.'
            conflicted_files="$(git diff --name-only --diff-filter=U)"
            echo "$conflicted_files"

            if grep -Fxq 'README.md' <<< "$conflicted_files"; then
              echo 'Keeping origin/master README.md'
              git checkout --theirs -- README.md
              git add README.md
            fi

            # Upstream consolidated the GUI and Web FFmpeg download implementations
            # into VDF.Core.FFTools.FfmpegDownloader. These shells contain no
            # perf-branch acceleration logic, so master is authoritative for them.
            for file in \
              'VDF.GUI/ViewModels/MainWindowVM_FfmpegDownloader.cs' \
              'VDF.Web/Services/FFmpegSetupService.cs'; do
              if grep -Fxq "$file" <<< "$conflicted_files"; then
                echo "Taking origin/master shared-downloader shell for $file"
                git checkout --theirs -- "$file"
                git add "$file"
              fi
            done

            # FfmpegEngine.cs contains the perf branch's native acceleration engine,
            # timing types and health policy integration. Preserve that coherent file;
            # upstream's new AI-facing APIs live in the perf-only AiCompat partial.
            file='VDF.Core/FFTools/FfmpegEngine.cs'
            if grep -Fxq "$file" <<< "$conflicted_files"; then
              echo "Keeping perf implementation of $file; AiCompat supplies upstream APIs"
              git checkout --ours -- "$file"
              git add "$file"
            fi

            # VideoStreamDecoder.cs is extensively specialized on the perf branch for
            # native and hardware decoding. Keep that implementation; the compatibility
            # patch below reapplies master's small stream-group metadata contract.
            file='VDF.Core/FFTools/FFmpegNative/VideoStreamDecoder.cs'
            if grep -Fxq "$file" <<< "$conflicted_files"; then
              echo "Keeping perf implementation of $file; compatibility patch supplies upstream metadata"
              git checkout --ours -- "$file"
              git add "$file"
            fi

            remaining_conflicts="$(git diff --name-only --diff-filter=U)"
            if [ -n "$remaining_conflicts" ]; then
              echo 'Unresolved source conflicts remain and require review:'
              echo "$remaining_conflicts"
              printf '%s\n' "$remaining_conflicts" > perf-merge-conflicts.txt
              while IFS= read -r file; do
                [ -z "$file" ] || echo "::error file=$file::Unresolved perf refresh merge conflict"
              done <<< "$remaining_conflicts"
              exit 1
            fi
          fi

          # Restore the small perf-owned compatibility contracts that an otherwise
          # clean textual merge can silently replace: AI settings, stream-group metadata,
          # and pHash quorum.
          python .github/scripts/patch-perf-merge.py
          git add VDF.Core/FFTools/FfmpegEngine.cs \
            VDF.Core/FFTools/FFmpegNative/VideoStreamDecoder.cs \
            VDF.Core/ScanEngine.cs

          # Fail immediately if the intended all-sample implementation was not inserted.
          if ! grep -q 'BitOperations.PopCount(phashes\[j\] \^ phashesComp\[j\])' VDF.Core/ScanEngine.cs; then
            echo '::error file=VDF.Core/ScanEngine.cs::pHash quorum patch was not applied'
            exit 1
          fi

          if ! grep -q 'HasStreamGroups' VDF.Core/FFTools/FFmpegNative/VideoStreamDecoder.cs; then
            echo '::error file=VDF.Core/FFTools/FFmpegNative/VideoStreamDecoder.cs::Stream-group compatibility patch was not applied'
            exit 1
          fi

          if git rev-parse -q --verify MERGE_HEAD >/dev/null; then
            git commit --no-edit
          fi

          after="$(git rev-parse HEAD)"
          echo "before=$before" >> "$GITHUB_OUTPUT"
          echo "after=$after" >> "$GITHUB_OUTPUT"

          if [ "$before" = "$after" ]; then
            echo 'merge_changed=false' >> "$GITHUB_OUTPUT"
            echo 'meaningful_changed=false' >> "$GITHUB_OUTPUT"
            echo 'No 4.1 perf branch changes from origin/master.'
            exit 0
          fi

          changed_files="$(git diff --name-only "$before" "$after")"
          meaningful_changes="$(printf '%s\n' "$changed_files" | grep -Ev '^(README\.md|\.github/workflows/)' || true)"

          echo 'merge_changed=true' >> "$GITHUB_OUTPUT"
          if [ -n "$meaningful_changes" ]; then
            echo 'meaningful_changed=true' >> "$GITHUB_OUTPUT"
            echo 'Meaningful changes detected:'
            echo "$meaningful_changes"
          else
            echo 'meaningful_changed=false' >> "$GITHUB_OUTPUT"
            echo 'Only ignored files changed; release build will not be dispatched.'
          fi

      - name: Upload merge conflict report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: perf-merge-conflicts
          path: perf-merge-conflicts.txt
          if-no-files-found: ignore

      - name: Setup .NET
        if: steps.merge.outputs.merge_changed == 'true'
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Validate merged 4.1 branch
        if: steps.merge.outputs.merge_changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee perf-validation.log) 2>&1
          dotnet build VDF.GUI/VDF.GUI.csproj -c Release -v q
          dotnet build VDF.CLI/VDF.CLI.csproj -c Release -v q
          dotnet test VDF.Core.Tests/VDF.Core.Tests.csproj -c Release --logger "console;verbosity=detailed"
          dotnet test VDF.GUI.Tests/VDF.GUI.Tests.csproj -c Release -v q
          dotnet test VDF.CLI.Tests/VDF.CLI.Tests.csproj -c Release -v q

      - name: Upload validation failure state
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: perf-validation-state
          path: |
            perf-validation.log
            VDF.Core/ScanEngine.cs
            .github/scripts/patch-perf-merge.py
          if-no-files-found: ignore

      - name: Push updated 4.1 branch
        if: steps.merge.outputs.merge_changed == 'true'
        run: git push origin perf/4.1-native-hwaccel

      - name: Trigger 4.1 performance release
        if: steps.merge.outputs.meaningful_changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run releases.yml --ref perf/4.1-native-hwaccel
