name: Refresh 4.1 perf branch

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Sync master from upstream
    types:
      - completed
  push:
    branches:
      - master
    paths:
      - '.github/workflows/refresh-patched-branch.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: refresh-4.1-perf-branch
  cancel-in-progress: false

jobs:
  refresh:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: windows-latest

    steps:
      - name: Checkout 4.1 perf branch
        uses: actions/checkout@v7
        with:
          ref: perf/4.1-native-hwaccel
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch origin branches
        run: |
          git fetch origin master
          git fetch origin perf/4.1-native-hwaccel

      - name: Merge master and reconcile perf compatibility
        id: merge
        shell: bash
        run: |
          set -euo pipefail
          branch='perf/4.1-native-hwaccel'
          git checkout "$branch"
          before="$(git rev-parse HEAD)"

          set +e
          git merge --no-edit --no-commit origin/master
          merge_status=$?
          set -e

          # The performance branch owns its workflow definitions. Keep them across
          # upstream refreshes so default-token pushes never need workflow scope and
          # perf-only release policy is not silently replaced by master.
          git checkout "$before" -- .github/workflows
          git add .github/workflows

          if [ "$merge_status" -ne 0 ]; then
            echo 'Merge reported conflicts. Auto-resolving only known perf-owned boundaries.'
            conflicted_files="$(git diff --name-only --diff-filter=U)"
            echo "$conflicted_files"

            if grep -Fxq 'README.md' <<< "$conflicted_files"; then
              echo 'Keeping origin/master README.md'
              git checkout --theirs -- README.md
              git add README.md
            fi

            # These shells contain no perf acceleration logic; master is authoritative.
            for file in \
              'VDF.GUI/ViewModels/MainWindowVM_FfmpegDownloader.cs' \
              'VDF.Web/Services/FFmpegSetupService.cs'; do
              if grep -Fxq "$file" <<< "$conflicted_files"; then
                echo "Taking origin/master shared-downloader shell for $file"
                git checkout --theirs -- "$file"
                git add "$file"
              fi
            done

            if grep -Fxq 'VDF.Core/FFTools/FfmpegEngine.cs' <<< "$conflicted_files"; then
              echo 'Keeping perf FfmpegEngine.cs; compatibility partials/reconciliation carry upstream contracts'
              git checkout --ours -- VDF.Core/FFTools/FfmpegEngine.cs
              git add VDF.Core/FFTools/FfmpegEngine.cs
            fi

            if grep -Fxq 'VDF.Core/FFTools/FFmpegNative/VideoStreamDecoder.cs' <<< "$conflicted_files"; then
              echo 'Keeping perf VideoStreamDecoder.cs; reconciliation carries upstream decoder contracts'
              git checkout --ours -- VDF.Core/FFTools/FFmpegNative/VideoStreamDecoder.cs
              git add VDF.Core/FFTools/FFmpegNative/VideoStreamDecoder.cs
            fi

            remaining_conflicts="$(git diff --name-only --diff-filter=U)"
            if [ -n "$remaining_conflicts" ]; then
              echo 'Unresolved source conflicts remain and require review:'
              echo "$remaining_conflicts"
              printf '%s\n' "$remaining_conflicts" > perf-merge-conflicts.txt
              while IFS= read -r file; do
                [ -z "$file" ] || echo "::error file=$file::Unresolved perf refresh merge conflict"
              done <<< "$remaining_conflicts"
              exit 1
            fi
          fi

          if git rev-parse -q --verify MERGE_HEAD >/dev/null; then
            git commit --no-edit
          fi

          # Use the same canonical stack maintained on the perf branch. Keeping this
          # ordering in one script prevents automatic workflow_run refreshes from
          # drifting away from manual/perf-branch reconciliation behavior.
          python .github/scripts/reconcile-perf.py
          git add -A

          # Reconciliation must be a fixed point. A second pass changing source means
          # a patcher is duplicating/oscillating behavior and must not be pushed.
          python .github/scripts/reconcile-perf.py
          if ! git diff --quiet; then
            echo '::error::Perf reconciliation is not idempotent; the second pass changed source.'
            git diff --stat
            git diff
            exit 1
          fi

          if ! git diff --cached --quiet; then
            git commit -m 'perf: reconcile upstream compatibility'
          fi

          # Explicit dependency-closure guard for the dense-AI compatibility seam.
          # The compiler also catches this, but this message identifies the actual
          # reconciliation fault immediately rather than surfacing as a CS0234 later.
          if [ -f VDF.Core/FFTools/FfmpegEngine.DenseAiCompat.cs ] \
             && grep -q 'AI\.FramePool' VDF.Core/FFTools/FfmpegEngine.DenseAiCompat.cs \
             && [ ! -f VDF.Core/AI/FramePool.cs ]; then
            echo '::error file=VDF.Core/FFTools/FfmpegEngine.DenseAiCompat.cs::Dense AI compatibility requires VDF.Core/AI/FramePool.cs, but the dependency is missing.'
            exit 1
          fi

          after="$(git rev-parse HEAD)"
          echo "before=$before" >> "$GITHUB_OUTPUT"
          echo "after=$after" >> "$GITHUB_OUTPUT"

          if [ "$before" = "$after" ]; then
            echo 'merge_changed=false' >> "$GITHUB_OUTPUT"
            echo 'meaningful_changed=false' >> "$GITHUB_OUTPUT"
            echo 'Perf branch is already current and reconciled.'
            exit 0
          fi

          changed_files="$(git diff --name-only "$before" "$after")"
          meaningful_changes="$(printf '%s\n' "$changed_files" | grep -Ev '^(README\.md|docs/|\.github/workflows/|\.github/scripts/)' || true)"

          {
            echo 'changed_files<<EOF'
            echo "$changed_files"
            echo 'EOF'
            echo 'meaningful_changes<<EOF'
            echo "$meaningful_changes"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

          echo 'merge_changed=true' >> "$GITHUB_OUTPUT"
          if [ -n "$meaningful_changes" ]; then
            echo 'meaningful_changed=true' >> "$GITHUB_OUTPUT"
            echo 'Meaningful changes detected:'
            echo "$meaningful_changes"
          else
            echo 'meaningful_changed=false' >> "$GITHUB_OUTPUT"
            echo 'Only workflow/docs/refresh machinery changed; release build will not be dispatched.'
          fi

      - name: Upload merge conflict report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: perf-merge-conflicts
          path: perf-merge-conflicts.txt
          if-no-files-found: ignore

      - name: Setup .NET
        if: steps.merge.outputs.merge_changed == 'true'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Validate merged 4.1 branch
        if: steps.merge.outputs.merge_changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee perf-validation.log) 2>&1

          dotnet build VDF.GUI/VDF.GUI.csproj -c Release -v q
          dotnet build VDF.CLI/VDF.CLI.csproj -c Release -v q
          dotnet test VDF.Core.Tests/VDF.Core.Tests.csproj -c Release --logger 'console;verbosity=detailed'

          # GUI contains a handful of real-time/timer assertions. Retry the suite once
          # before blocking a correct upstream merge on a transient scheduler stall.
          if ! dotnet test VDF.GUI.Tests/VDF.GUI.Tests.csproj -c Release -v q; then
            echo '::warning::GUI tests failed once during refresh validation; retrying once to distinguish a timing flake from a reproducible failure.'
            sleep 2
            dotnet test VDF.GUI.Tests/VDF.GUI.Tests.csproj -c Release -v q
          fi

          dotnet test VDF.CLI.Tests/VDF.CLI.Tests.csproj -c Release -v q

      - name: Upload validation failure state
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: perf-validation-state
          path: |
            perf-validation.log
            VDF.Core/ScanEngine.cs
            .github/scripts/reconcile-perf.py
            .github/scripts/patch-perf-merge.py
            .github/scripts/patch-perf-upstream-parity.py
            .github/scripts/patch-perf-upstream-safety.py
            .github/scripts/patch-perf-ai-process.py
          if-no-files-found: ignore

      - name: Verify perf branch did not advance during validation
        if: steps.merge.outputs.merge_changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin perf/4.1-native-hwaccel
          remote_tip="$(git rev-parse origin/perf/4.1-native-hwaccel)"
          if [ "$remote_tip" != '${{ steps.merge.outputs.before }}' ]; then
            echo "::error::Perf branch advanced during refresh validation (${{ steps.merge.outputs.before }} -> $remote_tip). Refusing a stale push; rerun refresh against the new tip."
            exit 1
          fi

      - name: Push updated 4.1 branch
        if: steps.merge.outputs.merge_changed == 'true'
        run: git push origin perf/4.1-native-hwaccel

      - name: Trigger 4.1 performance release
        if: steps.merge.outputs.meaningful_changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run releases.yml --ref perf/4.1-native-hwaccel
