name: Refresh 4.1 perf branch

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Sync master from upstream
    types:
      - completed
  push:
    branches:
      - master
    paths:
      - .github/workflows/refresh-patched-branch.yml

permissions:
  contents: write
  actions: write

concurrency:
  group: refresh-4.1-perf-branch
  cancel-in-progress: false

jobs:
  refresh:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 4.1 perf branch
        uses: actions/checkout@v5
        with:
          ref: perf/4.1-native-hwaccel
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch origin branches
        run: |
          git fetch origin master
          git fetch origin perf/4.1-native-hwaccel

      - name: Merge fork master into 4.1 perf branch
        id: merge
        shell: bash
        run: |
          set -euo pipefail
          branch='perf/4.1-native-hwaccel'
          git checkout "$branch"
          before="$(git rev-parse HEAD)"

          set +e
          git merge --no-edit --no-commit origin/master
          merge_status=$?
          set -e

          # The performance branch owns