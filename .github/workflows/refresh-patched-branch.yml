name: Refresh perf branch

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Sync master from upstream
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: refresh-perf-branch
  cancel-in-progress: false

jobs:
  refresh:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout perf branch
        uses: actions/checkout@v5
        with:
          ref: perf/native-hwaccel-from-crashfix
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch origin branches
        run: |
          git fetch origin master
          git fetch origin perf/native-hwaccel-from-crashfix

      - name: Refuse automated workflow-file sync
        shell: bash
        run: |
          workflow_changes="$(git diff --name-only HEAD origin/master -- .github/workflows || true)"
          if [ -n "$workflow_changes" ]; then
            echo "::error::origin/master contains workflow file changes that the default GITHUB_TOKEN cannot push from Actions."
            echo "::error::Sync perf/native-hwaccel-from-crashfix locally with a token that has workflow permission, then rerun this workflow."
            echo "Workflow files requiring manual sync:"
            echo "$workflow_changes"
            exit 1
          fi

      - name: Merge fork master into perf branch
        run: |
          git checkout perf/native-hwaccel-from-crashfix
          git merge --no-edit origin/master

      - name: Push updated branch
        run: |
          git push origin perf/native-hwaccel-from-crashfix
