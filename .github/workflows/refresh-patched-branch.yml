name: Refresh 4.1 perf branch
# Trigger installed janitor definition.

on:
  workflow_run:
    workflows:
      - Sync master from upstream
    types:
      - completed
  push:
    branches:
      - master
    paths:
      - .github/workflows/refresh-patched-branch.yml

permissions:
  contents: write
  actions: write

concurrency:
  group: refresh-4.1-perf-branch
  cancel-in-progress: true

jobs:
  cleanup-retired-sidebar-workflows:
    if: ${{ github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 0

      - name: Delete runs for retired sidebar workflows
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          names='[
            "Apply 4.1 comparer correctness port",
            "Apply 4.1 matching headroom port",
            "Apply 4.1 pHash sample quorum port",
            "Capture 4.1 release hash",
            "Diagnose refresh merge conflict",
            "Dispatch release and clean temporary branches",
            "Resolve refresh merge",
            "Resolve refresh merge fast"
          ]'

          mapfile -t run_ids < <(
            gh api --paginate "/repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" \
              --jq ".workflow_runs[] | select(.name as \$name | ${names} | index(\$name)) | .id"
          )

          echo "Deleting ${#run_ids[@]} retired workflow runs."
          for run_id in "${run_ids[@]}"; do
            echo "Deleting run ${run_id}"
            gh api -X DELETE "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}"
          done

      - name: Record cleanup completion
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf 'retired sidebar workflow cleanup completed\n' > .github/obsolete-workflow-cleanup.done
          git add .github/obsolete-workflow-cleanup.done
          git commit -m "ci: confirm retired workflow cleanup"
          git push origin master
