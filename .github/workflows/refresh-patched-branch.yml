name: Refresh perf branch

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Sync master from upstream
    types:
      - completed
  # Re-run compatibility reconciliation when the perf-owned refresh machinery changes.
  # The reconciliation commit touches source files, not these paths, so it does not loop.
  push:
    branches:
      - perf/4.1-native-hwaccel
    paths:
      - '.github/scripts/patch-perf-merge.py'
      - '.github/scripts/patch-perf-upstream-parity.py'
      - '.github/scripts/patch-perf-upstream-safety.py'
      - '.github/scripts/patch-perf-ai-process.py'
      - '.github/workflows/refresh-patched-branch.yml'
      - 'VDF.Core/FFTools/FfmpegEngine.UpstreamCompat.cs'
      - 'VDF.Core/FFTools/FfmpegEngine.AiProcessCombined.cs'

permissions:
  contents: write
  actions: write

concurrency:
  group: refresh-perf-branch
  cancel-in-progress: false

jobs:
  refresh:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout perf branch
        uses: actions/checkout@v5
        with:
          ref: perf/4.1-native-hwaccel
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch origin branches
        run: |
          git fetch origin master
          git fetch origin perf/4.1-native-hwaccel

      - name: Merge master and reconcile perf compatibility
        id: merge
        shell: bash
        run: |
          set -euo pipefail
          git checkout perf/4.1-native-hwaccel
          before="$(git rev-parse HEAD)"

          set +e
          git merge --no-edit --no-commit origin/master
          merge_status=$?
          set -e

          # The perf branch intentionally owns its workflow definitions. Restore them
          # before committing so upstream workflow churn never replaces release/refresh policy.
          git checkout "$before" -- .github/workflows
          git add .github/workflows

          if [ "$merge_status" -ne 0 ]; then
            echo "Merge reported conflicts. Auto-resolving only known perf-owned boundaries."
            conflicted_files="$(git diff --name-only --diff-filter=U)"
            echo "$conflicted_files"

            if echo "$conflicted_files" | grep -Fxq "README.md"; then
              echo "Keeping origin/master version of README.md"
              git checkout --theirs -- README.md
              git add README.md
            fi

            if echo "$conflicted_files" | grep -Fxq "VDF.Core/FFTools/FfmpegEngine.cs"; then
              echo "Keeping the perf FFmpeg implementation; compatibility patches run below"
              git checkout --ours -- VDF.Core/FFTools/FfmpegEngine.cs
              git add VDF.Core/FFTools/FfmpegEngine.cs
            fi

            if echo "$conflicted_files" | grep -Fxq "VDF.Core/FFTools/FFmpegNative/VideoStreamDecoder.cs"; then
              echo "Keeping the perf decoder; compatibility patches run below"
              git checkout --ours -- VDF.Core/FFTools/FFmpegNative/VideoStreamDecoder.cs
              git add VDF.Core/FFTools/FFmpegNative/VideoStreamDecoder.cs
            fi

            remaining_conflicts="$(git diff --name-only --diff-filter=U)"
            if [ -n "$remaining_conflicts" ]; then
              echo "Unresolved non-owned conflicts remain:"
              echo "$remaining_conflicts"
              exit 1
            fi
          fi

          if git rev-parse -q --verify MERGE_HEAD >/dev/null; then
            git commit --no-edit
          fi

          # Keep the custom performance engine aligned with upstream correctness behavior.
          # These are the only places source compatibility repairs are applied; release builds
          # consume committed source verbatim and never patch/commit code themselves.
          python3 .github/scripts/patch-perf-merge.py
          python3 .github/scripts/patch-perf-upstream-parity.py
          python3 .github/scripts/patch-perf-upstream-safety.py
          python3 .github/scripts/patch-perf-ai-process.py
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "perf: reconcile upstream compatibility"
          fi

          after="$(git rev-parse HEAD)"
          echo "before=$before" >> "$GITHUB_OUTPUT"
          echo "after=$after" >> "$GITHUB_OUTPUT"

          if [ "$before" = "$after" ]; then
            echo "merge_changed=false" >> "$GITHUB_OUTPUT"
            echo "meaningful_changed=false" >> "$GITHUB_OUTPUT"
            echo "Perf branch is already current and reconciled."
            exit 0
          fi

          changed_files="$(git diff --name-only "$before" "$after")"
          meaningful_changes="$(printf '%s\n' "$changed_files" | grep -Ev '^(README\.md|docs/|\.github/workflows/|\.github/scripts/)' || true)"

          {
            echo "changed_files<<EOF"
            echo "$changed_files"
            echo "EOF"
            echo "meaningful_changes<<EOF"
            echo "$meaningful_changes"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          echo "merge_changed=true" >> "$GITHUB_OUTPUT"
          if [ -n "$meaningful_changes" ]; then
            echo "meaningful_changed=true" >> "$GITHUB_OUTPUT"
            echo "Meaningful changes detected:"
            echo "$meaningful_changes"
          else
            echo "meaningful_changed=false" >> "$GITHUB_OUTPUT"
            echo "Only workflow/docs/refresh machinery changed; release build will not be dispatched."
          fi

      - name: Push updated branch
        if: steps.merge.outputs.merge_changed == 'true'
        run: git push origin perf/4.1-native-hwaccel

      - name: Trigger Build releases
        if: steps.merge.outputs.meaningful_changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run releases.yml --ref perf/4.1-native-hwaccel
