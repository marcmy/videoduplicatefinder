name: Refresh perf branch

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Sync master from upstream
    types:
      - completed
  # Keep workflow-maintenance commits in the perf branch ancestry. The merge step
  # restores the perf branch's own workflow files, and workflow-only changes do not
  # dispatch a release build.
  push:
    branches:
      - master
    paths:
      - .github/workflows/refresh-patched-branch.yml

permissions:
  contents: write
  actions: write

concurrency:
  group: refresh-perf-branch
  cancel-in-progress: false

jobs:
  refresh:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout perf branch
        uses: actions/checkout@v5
        with:
          ref: perf/native-hwaccel-from-crashfix
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch origin branches
        run: |
          git fetch origin master
          git fetch origin perf/native-hwaccel-from-crashfix

      - name: Merge fork master into perf branch
        id: merge
        shell: bash
        run: |
          git checkout perf/native-hwaccel-from-crashfix
          before="$(git rev-parse HEAD)"

          set +e
          git merge --no-edit --no-commit origin/master
          merge_status=$?
          set -e

          # The perf branch intentionally owns its workflow definitions. Restore them
          # before committing so the default GITHUB_TOKEN never needs workflow scope.
          git checkout "$before" -- .github/workflows
          git add .github/workflows

          if [ "$merge_status" -ne 0 ]; then
            echo "Merge reported conflicts. Auto-resolving only known safe conflicts."

            conflicted_files="$(git diff --name-only --diff-filter=U)"
            echo "$conflicted_files"

            if echo "$conflicted_files" | grep -Fxq "README.md"; then
              echo "Keeping origin/master version of README.md"
              git checkout --theirs -- README.md
              git add README.md
            fi

            # One-time guarded resolution for upstream issue #801. The perf branch
            # heavily rewrote this method, while master only added the still-image
            # guard around input seeking. Refuse to run for any other master commit.
            remaining_conflicts="$(git diff --name-only --diff-filter=U)"
            if [ "$remaining_conflicts" = "VDF.Core/FFTools/FfmpegEngine.cs" ]; then
              expected_master="08a50ec5c5e8074d37a3030c625732421cda7d4a"
              actual_master="$(git rev-parse origin/master)"
              if [ "$actual_master" != "$expected_master" ]; then
                echo "::error::Refusing the one-time FfmpegEngine resolver: expected master $expected_master, got $actual_master."
                exit 1
              fi

              echo "Keeping the perf implementation and applying master's still-image seek guard"
              git checkout --ours -- VDF.Core/FFTools/FfmpegEngine.cs
              python3 - <<'PY'
          from pathlib import Path

          path = Path("VDF.Core/FFTools/FfmpegEngine.cs")
          text = path.read_text(encoding="utf-8")
          old = '''\t\t\tpsi.ArgumentList.Add("-ss"); psi.ArgumentList.Add(settings.Position.ToString(null, CultureInfo.InvariantCulture));
          \t\t\tpsi.ArgumentList.Add("-i"); psi.ArgumentList.Add(FFToolsUtils.LongPathFix(settings.File));'''
          new = '''\t\t\t// Skip input seeking for still images: some JPEGs otherwise reach EOF before
          \t\t\t// a frame enters the filter graph, producing an empty successful output (#801).
          \t\t\tif (!FileUtils.IsImageFile(settings.File)) {
          \t\t\t\tpsi.ArgumentList.Add("-ss"); psi.ArgumentList.Add(settings.Position.ToString(null, CultureInfo.InvariantCulture));
          \t\t\t}
          \t\t\tpsi.ArgumentList.Add("-i"); psi.ArgumentList.Add(FFToolsUtils.LongPathFix(settings.File));'''
          if text.count(old) != 1:
              raise SystemExit("Expected exactly one unguarded -ss/-i block in FfmpegEngine.cs")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
              git add VDF.Core/FFTools/FfmpegEngine.cs
            fi

            remaining_conflicts="$(git diff --name-only --diff-filter=U)"
            if [ -n "$remaining_conflicts" ]; then
              echo "Unresolved conflicts remain:"
              echo "$remaining_conflicts"
              exit 1
            fi

            git commit --no-edit
          elif git rev-parse -q --verify MERGE_HEAD >/dev/null; then
            git commit --no-edit
          fi

          after="$(git rev-parse HEAD)"
          echo "before=$before" >> "$GITHUB_OUTPUT"
          echo "after=$after" >> "$GITHUB_OUTPUT"

          if [ "$before" = "$after" ]; then
            echo "merge_changed=false" >> "$GITHUB_OUTPUT"
            echo "meaningful_changed=false" >> "$GITHUB_OUTPUT"
            echo "No perf branch changes from origin/master."
            exit 0
          fi

          changed_files="$(git diff --name-only "$before" "$after")"
          meaningful_changes="$(printf '%s\n' "$changed_files" | grep -Ev '^(README\.md|\.github/workflows/)' || true)"

          {
            echo "changed_files<<EOF"
            echo "$changed_files"
            echo "EOF"
            echo "meaningful_changes<<EOF"
            echo "$meaningful_changes"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          echo "merge_changed=true" >> "$GITHUB_OUTPUT"
          if [ -n "$meaningful_changes" ]; then
            echo "meaningful_changed=true" >> "$GITHUB_OUTPUT"
            echo "Meaningful changes detected:"
            echo "$meaningful_changes"
          else
            echo "meaningful_changed=false" >> "$GITHUB_OUTPUT"
            echo "Only ignored files changed; release build will not be dispatched."
          fi

      - name: Push updated branch
        if: steps.merge.outputs.merge_changed == 'true'
        run: |
          git push origin perf/native-hwaccel-from-crashfix

      - name: Trigger Build releases
        if: steps.merge.outputs.meaningful_changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run releases.yml --ref perf/native-hwaccel-from-crashfix
