name: Refresh 4.1 perf branch
# One-shot cleanup trigger; the job restores the permanent workflow afterward.

on:
  workflow_run:
    workflows:
      - Sync master from upstream
    types:
      - completed
  push:
    branches:
      - master
    paths:
      - .github/workflows/refresh-patched-branch.yml

permissions:
  contents: write
  actions: write

concurrency:
  group: refresh-4.1-perf-branch
  cancel-in-progress: true

jobs:
  cleanup-obsolete-workflow-runs:
    if: ${{ github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 0

      - name: Delete runs for retired temporary workflows
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t run_ids < <(
            gh api --paginate "/repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" \
              --jq '.workflow_runs[] | select(.name == "Apply perf maintenance bundle" or .name == "Apply staged perf maintenance") | .id'
          )

          echo "Deleting ${#run_ids[@]} obsolete temporary workflow run(s)."
          for run_id in "${run_ids[@]}"; do
            echo "Deleting run ${run_id}"
            gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}"
          done

      - name: Restore permanent refresh workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git show "9d4b42367d73cfa52ccb64dcf4de7581e9dc79cc:.github/workflows/refresh-patched-branch.yml" > .github/workflows/refresh-patched-branch.yml
          git add .github/workflows/refresh-patched-branch.yml
          git commit -m "ci: restore refresh workflow after run cleanup"
          git push origin HEAD:master
