name: Refresh perf branch

# Temporary push trigger below runs the repaired refresh once; it is removed after verification.
on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Sync master from upstream
    types:
      - completed
  push:
    branches:
      - master
    paths:
      - .github/workflows/refresh-patched-branch.yml

permissions:
  contents: write
  actions: write

concurrency:
  group: refresh-perf-branch
  cancel-in-progress: false

jobs:
  refresh:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout perf branch
        uses: actions/checkout@v5
        with:
          ref: perf/native-hwaccel-from-crashfix
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch origin branches
        run: |
          git fetch origin master
          git fetch origin perf/native-hwaccel-from-crashfix

      - name: Merge fork master into perf branch
        id: merge
        shell: bash
        run: |
          git checkout perf/native-hwaccel-from-crashfix
          before="$(git rev-parse HEAD)"

          set +e
          git merge --no-edit --no-commit origin/master
          merge_status=$?
          set -e

          # The perf branch intentionally owns its workflow definitions. Restore them
          # before committing so the default GITHUB_TOKEN never needs workflow scope.
          git checkout "$before" -- .github/workflows
          git add .github/workflows

          if [ "$merge_status" -ne 0 ]; then
            echo "Merge reported conflicts. Auto-resolving only explicitly known safe conflicts."

            conflicted_files="$(git diff --name-only --diff-filter=U)"
            echo "$conflicted_files"

            if echo "$conflicted_files" | grep -Fxq "README.md"; then
              echo "Keeping origin/master version of README.md"
              git checkout --theirs -- README.md
              git add README.md
            fi

            # One-time resolution for the unchanged perf head while integrating upstream
            # master d3ddf389341b027572b977b28ae7403866bdd358. Upstream added a Vulkan
            # native-binding crash guard in the same area heavily rewritten by the perf
            # branch. Keep the perf implementation and apply that guard to it. The exact
            # perf-head gate prevents this from swallowing future unrelated conflicts.
            if [ "$before" = "20c1e404fb9597c052083c85322cdcbd1269909c" ] \
              && git merge-base --is-ancestor "d3ddf389341b027572b977b28ae7403866bdd358" origin/master \
              && echo "$conflicted_files" | grep -Fxq "VDF.Core/FFTools/FfmpegEngine.cs"; then
              echo "Applying the known Vulkan native-binding guard to the perf FfmpegEngine"
              git checkout --ours -- VDF.Core/FFTools/FfmpegEngine.cs
              python3 <<'PY'
          from pathlib import Path

          path = Path("VDF.Core/FFTools/FfmpegEngine.cs")
          text = path.read_text(encoding="utf-8")

          replacements = [
              (
                  "\t\tstatic int NativeConsecutiveFailures;\n\t\tstatic int NativeDisabledForSession;",
                  "\t\tstatic int NativeConsecutiveFailures;\n\t\tstatic int NativeDisabledForSession;\n\t\tstatic int VulkanNativeWarningLogged;",
              ),
              (
                  "\t\tstatic void ResetNativeBindingHealth() {\n\t\t\tVolatile.Write(ref NativeConsecutiveFailures, 0);\n\t\t\tVolatile.Write(ref NativeDisabledForSession, 0);\n\t\t}",
                  "\t\tstatic void ResetNativeBindingHealth() {\n\t\t\tVolatile.Write(ref NativeConsecutiveFailures, 0);\n\t\t\tVolatile.Write(ref NativeDisabledForSession, 0);\n\t\t\tVolatile.Write(ref VulkanNativeWarningLogged, 0);\n\t\t}",
              ),
              (
                  "\t\tstatic AVHWDeviceType GetConfiguredHardwareDeviceType(bool enableHardwareAcceleration = true) {\n"
                  "\t\t\tif (!enableHardwareAcceleration)\n"
                  "\t\t\t\treturn AVHWDeviceType.AV_HWDEVICE_TYPE_NONE;\n\n"
                  "\t\t\treturn HardwareAccelerationMode switch {\n"
                  "\t\t\t\tFFHardwareAccelerationMode.vdpau => AVHWDeviceType.AV_HWDEVICE_TYPE_VDPAU,\n"
                  "\t\t\t\tFFHardwareAccelerationMode.dxva2 => AVHWDeviceType.AV_HWDEVICE_TYPE_DXVA2,\n"
                  "\t\t\t\tFFHardwareAccelerationMode.vaapi => AVHWDeviceType.AV_HWDEVICE_TYPE_VAAPI,\n"
                  "\t\t\t\tFFHardwareAccelerationMode.qsv => AVHWDeviceType.AV_HWDEVICE_TYPE_QSV,\n"
                  "\t\t\t\tFFHardwareAccelerationMode.cuda => AVHWDeviceType.AV_HWDEVICE_TYPE_CUDA,\n"
                  "\t\t\t\tFFHardwareAccelerationMode.videotoolbox => AVHWDeviceType.AV_HWDEVICE_TYPE_VIDEOTOOLBOX,\n"
                  "\t\t\t\tFFHardwareAccelerationMode.d3d11va => AVHWDeviceType.AV_HWDEVICE_TYPE_D3D11VA,\n"
                  "\t\t\t\tFFHardwareAccelerationMode.drm => AVHWDeviceType.AV_HWDEVICE_TYPE_DRM,\n"
                  "\t\t\t\tFFHardwareAccelerationMode.mediacodec => AVHWDeviceType.AV_HWDEVICE_TYPE_MEDIACODEC,\n"
                  "\t\t\t\tFFHardwareAccelerationMode.vulkan => AVHWDeviceType.AV_HWDEVICE_TYPE_VULKAN,\n"
                  "\t\t\t\t_ => AVHWDeviceType.AV_HWDEVICE_TYPE_NONE\n"
                  "\t\t\t};\n"
                  "\t\t}",
                  "\t\tstatic AVHWDeviceType GetConfiguredHardwareDeviceType(bool enableHardwareAcceleration = true) {\n"
                  "\t\t\tif (!enableHardwareAcceleration)\n"
                  "\t\t\t\treturn AVHWDeviceType.AV_HWDEVICE_TYPE_NONE;\n\n"
                  "\t\t\t// Vulkan through the in-process native binding can segfault the app on\n"
                  "\t\t\t// some drivers (#799). Keep Vulkan available to the isolated FFmpeg\n"
                  "\t\t\t// process path, but force software decode for native calls.\n"
                  "\t\t\tif (HardwareAccelerationMode == FFHardwareAccelerationMode.vulkan) {\n"
                  "\t\t\t\tif (Interlocked.Exchange(ref VulkanNativeWarningLogged, 1) == 0) {\n"
                  "\t\t\t\t\tLogger.Instance.Info(\n"
                  "\t\t\t\t\t\t\"Vulkan hardware acceleration is not supported with the native FFmpeg binding \" +\n"
                  "\t\t\t\t\t\t\"(it crashes the process on some drivers, #799); decoding in software instead. \" +\n"
                  "\t\t\t\t\t\t\"Disable 'Use native FFmpeg binding' to run Vulkan via the CLI, or pick another \" +\n"
                  "\t\t\t\t\t\t\"hardware acceleration mode such as 'cuda'.\");\n"
                  "\t\t\t\t}\n"
                  "\t\t\t\treturn AVHWDeviceType.AV_HWDEVICE_TYPE_NONE;\n"
                  "\t\t\t}\n\n"
                  "\t\t\treturn HardwareAccelerationMode switch {\n"
                  "\t\t\t\tFFHardwareAccelerationMode.vdpau => AVHWDeviceType.AV_HWDEVICE_TYPE_VDPAU,\n"
                  "\t\t\t\tFFHardwareAccelerationMode.dxva2 => AVHWDeviceType.AV_HWDEVICE_TYPE_DXVA2,\n"
                  "\t\t\t\tFFHardwareAccelerationMode.vaapi => AVHWDeviceType.AV_HWDEVICE_TYPE_VAAPI,\n"
                  "\t\t\t\tFFHardwareAccelerationMode.qsv => AVHWDeviceType.AV_HWDEVICE_TYPE_QSV,\n"
                  "\t\t\t\tFFHardwareAccelerationMode.cuda => AVHWDeviceType.AV_HWDEVICE_TYPE_CUDA,\n"
                  "\t\t\t\tFFHardwareAccelerationMode.videotoolbox => AVHWDeviceType.AV_HWDEVICE_TYPE_VIDEOTOOLBOX,\n"
                  "\t\t\t\tFFHardwareAccelerationMode.d3d11va => AVHWDeviceType.AV_HWDEVICE_TYPE_D3D11VA,\n"
                  "\t\t\t\tFFHardwareAccelerationMode.drm => AVHWDeviceType.AV_HWDEVICE_TYPE_DRM,\n"
                  "\t\t\t\tFFHardwareAccelerationMode.mediacodec => AVHWDeviceType.AV_HWDEVICE_TYPE_MEDIACODEC,\n"
                  "\t\t\t\t_ => AVHWDeviceType.AV_HWDEVICE_TYPE_NONE\n"
                  "\t\t\t};\n"
                  "\t\t}",
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one match, found {count}: {old[:80]!r}")
              text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")
          PY
              git add VDF.Core/FFTools/FfmpegEngine.cs
            fi

            remaining_conflicts="$(git diff --name-only --diff-filter=U)"
            if [ -n "$remaining_conflicts" ]; then
              echo "Unresolved conflicts remain:"
              echo "$remaining_conflicts"
              exit 1
            fi
          fi

          if git rev-parse -q --verify MERGE_HEAD >/dev/null; then
            git commit --no-edit
          fi

          after="$(git rev-parse HEAD)"
          echo "before=$before" >> "$GITHUB_OUTPUT"
          echo "after=$after" >> "$GITHUB_OUTPUT"

          if [ "$before" = "$after" ]; then
            echo "merge_changed=false" >> "$GITHUB_OUTPUT"
            echo "meaningful_changed=false" >> "$GITHUB_OUTPUT"
            echo "No perf branch changes from origin/master."
            exit 0
          fi

          changed_files="$(git diff --name-only "$before" "$after")"
          meaningful_changes="$(printf '%s\n' "$changed_files" | grep -Ev '^(README\.md|\.github/workflows/)' || true)"

          {
            echo "changed_files<<EOF"
            echo "$changed_files"
            echo "EOF"
            echo "meaningful_changes<<EOF"
            echo "$meaningful_changes"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          echo "merge_changed=true" >> "$GITHUB_OUTPUT"
          if [ -n "$meaningful_changes" ]; then
            echo "meaningful_changed=true" >> "$GITHUB_OUTPUT"
            echo "Meaningful changes detected:"
            echo "$meaningful_changes"
          else
            echo "meaningful_changed=false" >> "$GITHUB_OUTPUT"
            echo "Only ignored files changed; release build will not be dispatched."
          fi

      - name: Push updated branch
        if: steps.merge.outputs.merge_changed == 'true'
        run: |
          git push origin perf/native-hwaccel-from-crashfix

      - name: Trigger Build releases
        if: steps.merge.outputs.meaningful_changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run releases.yml --ref perf/native-hwaccel-from-crashfix
