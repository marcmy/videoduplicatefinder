name: Persist thumbnail auto-align removal

on:
  pull_request:
    branches:
      - perf/native-hwaccel-from-crashfix
    types:
      - synchronize

permissions:
  contents: write

jobs:
  persist-cleanup:
    if: github.head_ref == 'remove/thumbnail-auto-align'
    runs-on: ubuntu-latest
    steps:
      - name: Check out cleanup branch
        uses: actions/checkout@v4
        with:
          ref: remove/thumbnail-auto-align
          fetch-depth: 0
          persist-credentials: true

      - name: Detect whether cleanup is already applied
        id: state
        shell: bash
        run: |
          if [[ -f VDF.Core/FFTools/FrameAlignment.cs ]]; then
            echo 'needed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'needed=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Execute staged cleanup script
        if: steps.state.outputs.needed == 'true'
        shell: bash
        run: |
          python3 <<'BOOT'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/remove-thumbnail-auto-align.yml').read_text(encoding='utf-8')
          start_marker = "          python3 <<'PY'\n"
          end_marker = "\n          PY\n"
          script = workflow.split(start_marker, 1)[1].split(end_marker, 1)[0]
          exec(compile(textwrap.dedent(script), 'remove-thumbnail-auto-align.py', 'exec'))
          BOOT

      - name: Verify removal diff
        if: steps.state.outputs.needed == 'true'
        shell: bash
        run: |
          git diff --check
          if git grep -n -E 'AutoAlign|FrameAlignment|alignmentGray|AlignmentGrayFrame|ExtractGrayFrames' -- . ':(exclude).github/workflows/remove-thumbnail-auto-align.yml' ':(exclude).github/workflows/execute-thumbnail-auto-align-removal.yml' ':(exclude).github/workflows/execute-thumbnail-auto-align-removal-v2.yml'; then
            exit 1
          fi

      - name: Commit cleanup
        if: steps.state.outputs.needed == 'true'
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'remove thumbnail comparer auto-align'
          git push origin HEAD:remove/thumbnail-auto-align
