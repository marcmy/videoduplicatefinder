name: Apply 4.1 matching headroom port

on:
  push:
    branches:
      - perf/4.1-native-hwaccel
    paths:
      - .github/workflows/port-41-matching-headroom.yml

permissions:
  contents: write
  pull-requests: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: perf/4.1-native-hwaccel
          fetch-depth: 0

      - name: Fetch reference branch
        run: git fetch origin perf/native-hwaccel-from-crashfix

      - name: Adapt port script to 4.1 partial-clip structure
        shell: python
        run: |
          from pathlib import Path
          path = Path('tools/port-41-matching-headroom.py')
          text = path.read_text(encoding='utf-8')
          old = 'partial_old = "MaxDegreeOfParallelism = Math.Max(1, Settings.MaxDegreeOfParallelism)"'
          new = 'partial_old = "MaxDegreeOfParallelism = ParallelDegree"'
          if text.count(old) != 1:
              raise RuntimeError(f'expected one legacy partial-DOP anchor, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')

      - name: Apply matching-only concurrency port
        id: port
        shell: bash
        run: |
          set +e
          python tools/port-41-matching-headroom.py > port.log 2>&1
          code=$?
          cat port.log
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Report port failure
        if: steps.port.outputs.code != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo '### Matching-headroom port failed'
            echo
            echo '```text'
            cat port.log
            echo '```'
          } > port-comment.md
          gh pr comment 56 --body-file port-comment.md
          exit 1

      - name: Validate Core build
        if: steps.port.outputs.code == '0'
        run: dotnet build VDF.Core.Tests/VDF.Core.Tests.csproj -c Release -v q

      - name: Validate GUI build
        if: steps.port.outputs.code == '0'
        run: dotnet build VDF.GUI/VDF.GUI.csproj -c Release -v q

      - name: Commit port
        if: steps.port.outputs.code == '0'
        shell: bash
        run: |
          rm -f .github/workflows/port-41-matching-headroom.yml tools/port-41-matching-headroom.py port.log
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "perf: reserve CPU headroom during 4.1 duplicate matching"
          git push origin HEAD:perf/4.1-native-hwaccel
