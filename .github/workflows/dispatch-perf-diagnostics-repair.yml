name: Dispatch perf diagnostics repair

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/dispatch-perf-diagnostics-repair.yml'

permissions:
  actions: write
  contents: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch repair workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run repair-perf-ffmpeg-diagnostics.yml --repo "${{ github.repository }}" --ref master

      - name: Remove dispatcher
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          FILE: .github/workflows/dispatch-perf-diagnostics-repair.yml
        shell: bash
        run: |
          sha="$(gh api "repos/$REPO/contents/$FILE?ref=master" --jq .sha)"
          gh api --method DELETE "repos/$REPO/contents/$FILE" \
            -f message='Remove perf diagnostics repair dispatcher' \
            -f sha="$sha" \
            -f branch='master'
