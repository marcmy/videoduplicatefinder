name: Build 4.1 performance release

on:
  workflow_dispatch:
  push:
    branches:
      - perf/4.1-native-hwaccel
    paths-ignore:
      - '.github/workflows/**'
      - 'README.md'
      - 'docs/**'

permissions:
  contents: read

concurrency:
  group: vdf-4.1-performance-release
  cancel-in-progress: true

jobs:
  build:
    name: Build and test Windows x64 GUI
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
        with:
          ref: perf/4.1-native-hwaccel
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Apply pending RGB224 source repair
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          path = Path('VDF.Core/FFTools/FfmpegEngine.cs')
          text = path.read_text(encoding='utf-8')

          if 'bool isRgbFrame = settings.Rgb224;' not in text:
              replacements = [
                  (
                      '\t\t\tbool isGrayByte = settings.GrayScale == 1;\n',
                      '\t\t\tbool isGrayByte = settings.GrayScale == 1;\n'
                      '\t\t\tbool isRgbFrame = settings.Rgb224;\n'
                      '\t\t\tint expectedRgbBytes = global::VDF.Core.AI.OnnxEmbedder.InputSide * global::VDF.Core.AI.OnnxEmbedder.InputSide * 3;\n'
                  ),
                  (
                      '\t\t\t\tif (ShouldAttemptNativeSingleFrameExtraction(settings)) {\n',
                      '\t\t\t\tif (!isRgbFrame && ShouldAttemptNativeSingleFrameExtraction(settings)) {\n'
                  ),
                  (
                      '\t\t\tif (isGrayByte) {\n'
                      '\t\t\t\tstring vfChain = $"scale={graySideLength}:{graySideLength}:flags=bicubic,format=gray";\n',
                      '\t\t\tif (isRgbFrame) {\n'
                      '\t\t\t\tint side = global::VDF.Core.AI.OnnxEmbedder.InputSide;\n'
                      '\t\t\t\tpsi.ArgumentList.Add("-vf");\n'
                      '\t\t\t\tpsi.ArgumentList.Add($"scale={side}:{side}:flags=bicubic,format=rgb24");\n'
                      '\t\t\t\tpsi.ArgumentList.Add("-f"); psi.ArgumentList.Add("rawvideo");\n'
                      '\t\t\t\tpsi.ArgumentList.Add("-pix_fmt"); psi.ArgumentList.Add("rgb24");\n'
                      '\t\t\t}\n'
                      '\t\t\telse if (isGrayByte) {\n'
                      '\t\t\t\tstring vfChain = $"scale={graySideLength}:{graySideLength}:flags=bicubic,format=gray";\n'
                  ),
                  (
                      '\t\t\tforeach (var item in remainingCustomArgs) psi.ArgumentList.Add(item);\n',
                      '\t\t\tif (!isRgbFrame)\n'
                      '\t\t\t\tforeach (var item in remainingCustomArgs) psi.ArgumentList.Add(item);\n'
                  ),
                  (
                      '\t\t\t\telse if (isGrayByte && bytes.Length != expectedGrayBytes) {\n'
                      '\t\t\t\t\terrOut.AppendLine($"graybytes length != {expectedGrayBytes} (got {bytes.Length})");\n'
                      '\t\t\t\t\tbytes = null;\n'
                      '\t\t\t\t}\n',
                      '\t\t\t\telse if (isGrayByte && bytes.Length != expectedGrayBytes) {\n'
                      '\t\t\t\t\terrOut.AppendLine($"graybytes length != {expectedGrayBytes} (got {bytes.Length})");\n'
                      '\t\t\t\t\tbytes = null;\n'
                      '\t\t\t\t}\n'
                      '\t\t\t\telse if (isRgbFrame && bytes.Length != expectedRgbBytes) {\n'
                      '\t\t\t\t\terrOut.AppendLine($"AI frame length != {expectedRgbBytes} (got {bytes.Length})");\n'
                      '\t\t\t\t\tbytes = null;\n'
                      '\t\t\t\t}\n'
                  ),
              ]

              for old, new in replacements:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'Expected exactly one patch target, found {count}: {old[:80]!r}')
                  text = text.replace(old, new, 1)

              path.write_text(text, encoding='utf-8')
          '@ | python -

          if (Test-Path .github/workflows/apply-rgb224-compat-fix.yml) {
            Remove-Item .github/workflows/apply-rgb224-compat-fix.yml -Force
          }

          if (git status --porcelain) {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "fix: support raw RGB224 extraction in perf engine"
            git push origin perf/4.1-native-hwaccel
          }

      - name: Verify 4.1 performance engine
        shell: pwsh
        run: |
          $requiredFiles = @(
            'VDF.Core/FFTools/FFmpegNative/Gray32FrameExtractor.cs',
            'VDF.Core/FFTools/FFmpegNative/D3D11GrayByteScaler.cs',
            'VDF.Core/FFTools/FFmpegNative/D3D11VideoProcessorGrayByteScaler.cs',
            'VDF.Core/ScanEngine.MatchingConcurrency.cs'
          )
          foreach ($path in $requiredFiles) {
            if (!(Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Required performance-engine file is missing: $path"
            }
          }

          $settings = Get-Content VDF.Core/Settings.cs -Raw
          foreach ($setting in @('MatchingMaxDegreeOfParallelism', 'PHashRequiredMatchingSampleRatio')) {
            if (!$settings.Contains($setting)) {
              throw "Required performance setting is missing: $setting"
            }
          }

      - name: Run Core tests
        run: dotnet test VDF.Core.Tests/VDF.Core.Tests.csproj -c Release -v q

      - name: Run GUI tests
        run: dotnet test VDF.GUI.Tests/VDF.GUI.Tests.csproj -c Release -v q

      - name: Install FFmpeg
        run: choco install ffmpeg -y --no-progress

      - name: Run FFmpeg integration tests
        shell: pwsh
        run: |
          dotnet test VDF.IntegrationTests/VDF.IntegrationTests.csproj -c Release -v normal --logger "trx;LogFileName=integration.trx" 2>&1 |
            Tee-Object -FilePath integration-test.log
          exit $LASTEXITCODE

      - name: Upload FFmpeg integration failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ffmpeg-integration-failure-${{ github.run_attempt }}
          path: |
            integration-test.log
            VDF.IntegrationTests/TestResults/integration.trx
          if-no-files-found: warn
          retention-days: 7

      - name: Publish Windows x64 GUI Native AOT
        run: dotnet publish VDF.GUI/VDF.GUI.csproj -c Release -v q -p:PublishAot=true -r win-x64 -o outputGUI

      - name: Package GUI-win-x64.zip
        shell: pwsh
        run: |
          if (!(Test-Path outputGUI/VDF.GUI.exe -PathType Leaf)) {
            throw 'Native AOT publish did not produce VDF.GUI.exe.'
          }

          Get-ChildItem outputGUI -Recurse -File |
            Where-Object Extension -in '.pdb', '.dbg' |
            Remove-Item -Force
          Get-ChildItem outputGUI -Recurse -Directory -Filter '*.dSYM' |
            Remove-Item -Recurse -Force

          $symbols = Get-ChildItem outputGUI -Recurse | Where-Object {
            (!$_.PSIsContainer -and $_.Extension -in '.pdb', '.dbg') -or
            ($_.PSIsContainer -and $_.Name -like '*.dSYM')
          }
          if ($symbols) {
            throw 'Runtime GUI output still contains debug symbols.'
          }

          Compress-Archive -Path outputGUI/* -DestinationPath GUI-win-x64.zip -Force
          if ((Get-Item GUI-win-x64.zip).Length -le 0) {
            throw 'GUI archive is empty.'
          }

      - name: Upload validated GUI archive
        uses: actions/upload-artifact@v7
        with:
          name: release-win-x64-gui
          path: GUI-win-x64.zip
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish 4.1.x GUI release
    needs: build
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref_name == 'perf/4.1-native-hwaccel'
    permissions:
      contents: write
    steps:
      - name: Download validated GUI archive
        uses: actions/download-artifact@v8
        with:
          name: release-win-x64-gui
          path: release-assets

      - name: Validate release archive
        shell: bash
        run: |
          set -euo pipefail
          archive='release-assets/GUI-win-x64.zip'
          test -s "$archive"
          unzip -Z1 "$archive" | grep -Eq '(^|/)VDF\.GUI\.exe$'
          if unzip -Z1 "$archive" | grep -Eiq '\.(pdb|dbg)$|\.dSYM/'; then
            echo 'GUI-win-x64.zip contains debug symbols.' >&2
            exit 1
          fi

      - name: Publish fork 4.1.x release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ github.token }}
          tag_name: 4.1.x
          target_commitish: ${{ github.sha }}
          files: release-assets/GUI-win-x64.zip
          fail_on_unmatched_files: true
          body: |
            Daily Windows x64 GUI-only Native AOT performance build from perf/4.1-native-hwaccel.

            Includes the upstream 4.1 interface and drive-aware scanner plus native batched FFmpeg extraction, D3D11 gray-byte acceleration, capability-scoped hardware fallback, multi-sample pHash matching, comparer correctness fixes, and reserved CPU headroom during duplicate matching.

            This release intentionally publishes only GUI-win-x64.zip. CLI, Web, bundles, symbols, and the retired full Scoop package are not produced.

            Last build based on ${{ github.sha }}

      - name: Remove stale release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r asset; do
            if [ "$asset" != 'GUI-win-x64.zip' ]; then
              gh release delete-asset 4.1.x "$asset" --yes
            fi
          done < <(gh release view 4.1.x --json assets --jq '.assets[].name')

      - name: Trigger Scoop Excavator
        env:
          GH_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN || secrets.GH_PAT || secrets.PAT }}
        shell: bash
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo 'No cross-repository token configured; Scoop Excavator will pick up the release on its schedule.'
            exit 0
          fi
          gh workflow run excavator.yml --repo marcmy/scoop-bucket --ref master
