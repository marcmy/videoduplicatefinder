name: Build 4.1 performance release

on:
  workflow_dispatch:
  push:
    branches:
      - perf/4.1-native-hwaccel
    paths-ignore:
      - '.github/workflows/**'
      - 'README.md'
      - 'docs/**'
      - 'PERF_BRANCH.md'
      - 'FORK_DIFFERENCES.md'
      - 'VDF.Benchmarks/README.md'

permissions:
  contents: read

concurrency:
  group: vdf-4.1-performance-release
  cancel-in-progress: true

jobs:
  build:
    name: Build and test Windows x64 GUI
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Verify 4.1 performance engine
        shell: pwsh
        run: |
          $requiredFiles = @(
            'VDF.Core/FFTools/FFmpegNative/Gray32FrameExtractor.cs',
            'VDF.Core/FFTools/FFmpegNative/D3D11GrayByteScaler.cs',
            'VDF.Core/FFTools/FFmpegNative/D3D11VideoProcessorGrayByteScaler.cs',
            'VDF.Core/FFTools/FfmpegEngine.UpstreamCompat.cs',
            'VDF.Core/FFTools/FfmpegEngine.AiProcessCombined.cs'
          )
          foreach ($path in $requiredFiles) {
            if (!(Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Required performance-engine file is missing: $path"
            }
          }

          $settings = Get-Content VDF.Core/Settings.cs -Raw
          foreach ($setting in @('MatchingMaxDegreeOfParallelism', 'PHashRequiredMatchingSampleRatio')) {
            if (!$settings.Contains($setting)) {
              throw "Required performance setting is missing: $setting"
            }
          }

          $engine = Get-Content VDF.Core/FFTools/FfmpegEngine.cs -Raw
          foreach ($marker in @('bool isRgbFrame = settings.Rgb224;', 'TryGetTiledHeifGridFrame(', 'ThrowIfTiledHeifRequiresProcess(')) {
            if (!$engine.Contains($marker)) {
              throw "Required perf/upstream compatibility marker is missing from FfmpegEngine.cs: $marker"
            }
          }

          $aiCompat = Get-Content VDF.Core/FFTools/FfmpegEngine.AiCompat.cs -Raw
          foreach ($marker in @('TryGetTiledHeifGridAiRgb224(', 'ThrowIfTiledHeifRequiresProcess(', 'GetGrayAndRgb224CliBounded(')) {
            if (!$aiCompat.Contains($marker)) {
              throw "Required AI compatibility/performance marker is missing from FfmpegEngine.AiCompat.cs: $marker"
            }
          }

          $combinedAi = Get-Content VDF.Core/FFTools/FfmpegEngine.AiProcessCombined.cs -Raw
          foreach ($marker in @('GetGrayAndRgb224CliBounded(', 'ContainsH264ReferenceRecoveryWarning(', 'Task.WhenAll(')) {
            if (!$combinedAi.Contains($marker)) {
              throw "Required combined AI process marker is missing: $marker"
            }
          }

      - name: Run Core tests
        run: dotnet test VDF.Core.Tests/VDF.Core.Tests.csproj -c Release -v q

      - name: Run GUI tests
        run: dotnet test VDF.GUI.Tests/VDF.GUI.Tests.csproj -c Release -v q

      - name: Install shared FFmpeg 8.1
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '8.1'
          $archive = "ffmpeg-n$version-latest-win64-gpl-shared-$version.zip"
          $baseUrl = 'https://github.com/BtbN/FFmpeg-Builds/releases/download/latest'
          $zipPath = Join-Path $env:RUNNER_TEMP $archive
          $extractRoot = Join-Path $env:RUNNER_TEMP 'vdf-ffmpeg-shared'
          $checksumPath = Join-Path $env:RUNNER_TEMP 'ffmpeg-checksums.sha256'

          curl.exe --fail --location --retry 3 --retry-delay 2 "$baseUrl/$archive" --output $zipPath
          if ($LASTEXITCODE -ne 0) { throw "Failed to download $archive" }
          curl.exe --fail --location --retry 3 --retry-delay 2 "$baseUrl/checksums.sha256" --output $checksumPath
          if ($LASTEXITCODE -ne 0) { throw 'Failed to download BtbN checksums.sha256' }

          $checksumLine = Get-Content $checksumPath |
            Where-Object { $_ -match "\s+$([Regex]::Escape($archive))\s*$" } |
            Select-Object -First 1
          if (!$checksumLine) { throw "No checksum entry found for $archive" }
          $expected = ($checksumLine -split '\s+')[0].ToLowerInvariant()
          $actual = (Get-FileHash -LiteralPath $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "FFmpeg archive checksum mismatch: expected $expected, got $actual"
          }

          if (Test-Path $extractRoot) { Remove-Item $extractRoot -Recurse -Force }
          Expand-Archive -LiteralPath $zipPath -DestinationPath $extractRoot -Force
          $ffmpeg = Get-ChildItem $extractRoot -Filter ffmpeg.exe -File -Recurse | Select-Object -First 1
          $ffprobe = Get-ChildItem $extractRoot -Filter ffprobe.exe -File -Recurse | Select-Object -First 1
          if (!$ffmpeg -or !$ffprobe) { throw 'Shared archive did not contain ffmpeg.exe and ffprobe.exe' }
          if ($ffmpeg.DirectoryName -ne $ffprobe.DirectoryName) { throw 'ffmpeg.exe and ffprobe.exe were not co-located' }

          $bin = $ffmpeg.DirectoryName
          foreach ($dll in @('avcodec-62.dll', 'avformat-62.dll', 'avutil-60.dll', 'swscale-9.dll', 'swresample-6.dll')) {
            if (!(Test-Path (Join-Path $bin $dll) -PathType Leaf)) {
              throw "Shared FFmpeg build is missing required native library: $dll"
            }
          }

          $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "VDF_TEST_SHARED_FFMPEG_BIN=$bin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Using verified shared FFmpeg from $bin"

      - name: Guard against performance regressions
        id: performance_regression
        shell: pwsh
        run: |
          & .github/scripts/perf-regression-gate.ps1 `
            -BaselineRef 'perf/4.1-baseline' `
            -Modes 'process,native-cpu' `
            -Iterations 9 `
            -WarmupIterations 2 `
            -MaxRegressionPercent 15

      - name: Upload performance regression reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: performance-regression-${{ github.run_attempt }}
          path: artifacts/perf-gate
          if-no-files-found: warn
          retention-days: 14

      - name: Profile full ScanEngine pipeline
        id: scan_pipeline_profile
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path artifacts/scan-pipeline -Force | Out-Null

          dotnet run -c Release --project VDF.Benchmarks -- `
            --probe-scan-pipeline `
            --mode process `
            --copies-per-codec 2 `
            --thumbnails 3 `
            --timeout-minutes 10 `
            --output artifacts/scan-pipeline/process.json 2>&1 |
            Tee-Object -FilePath artifacts/scan-pipeline/process.log
          if ($LASTEXITCODE -ne 0) { throw "Process scan-pipeline probe failed with exit code $LASTEXITCODE" }

          dotnet run -c Release --project VDF.Benchmarks -- `
            --probe-scan-pipeline `
            --mode native-cpu `
            --copies-per-codec 2 `
            --thumbnails 3 `
            --timeout-minutes 10 `
            --output artifacts/scan-pipeline/native-cpu.json 2>&1 |
            Tee-Object -FilePath artifacts/scan-pipeline/native-cpu.log
          if ($LASTEXITCODE -ne 0) { throw "Native-CPU scan-pipeline probe failed with exit code $LASTEXITCODE" }

      - name: Upload full-pipeline profiles
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: scan-pipeline-profiles-${{ github.run_attempt }}
          path: artifacts/scan-pipeline
          if-no-files-found: warn
          retention-days: 14

      - name: Run tiled HEIC conformance test
        shell: pwsh
        run: |
          & .github/scripts/fetch-tiled-heic-fixture.ps1 `
            -Destination artifacts/test-media/C007.heic `
            -RunTests

      - name: Run FFmpeg integration tests
        id: ffmpeg_integration_tests
        shell: pwsh
        run: |
          Write-Host "ffmpeg: $((Get-Command ffmpeg).Source)"
          Write-Host "ffprobe: $((Get-Command ffprobe).Source)"
          Get-ChildItem $env:VDF_TEST_SHARED_FFMPEG_BIN -Filter '*.dll' | Select-Object -ExpandProperty Name
          dotnet test VDF.IntegrationTests/VDF.IntegrationTests.csproj -c Release -v normal --logger "trx;LogFileName=integration.trx" 2>&1 |
            Tee-Object -FilePath integration-test.log
          exit $LASTEXITCODE

      - name: Upload FFmpeg integration failure diagnostics
        if: ${{ failure() && steps.ffmpeg_integration_tests.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: ffmpeg-integration-failure-${{ github.run_attempt }}
          path: |
            integration-test.log
            VDF.IntegrationTests/TestResults/integration.trx
          if-no-files-found: warn
          retention-days: 7

      - name: Publish Windows x64 GUI Native AOT
        run: dotnet publish VDF.GUI/VDF.GUI.csproj -c Release -v q -p:PublishAot=true -r win-x64 -o outputGUI

      - name: Package GUI-win-x64.zip
        shell: pwsh
        run: |
          if (!(Test-Path outputGUI/VDF.GUI.exe -PathType Leaf)) {
            throw 'Native AOT publish did not produce VDF.GUI.exe.'
          }

          Get-ChildItem outputGUI -Recurse -File |
            Where-Object Extension -in '.pdb', '.dbg' |
            Remove-Item -Force
          Get-ChildItem outputGUI -Recurse -Directory -Filter '*.dSYM' |
            Remove-Item -Recurse -Force

          $symbols = Get-ChildItem outputGUI -Recurse | Where-Object {
            (!$_.PSIsContainer -and $_.Extension -in '.pdb', '.dbg') -or
            ($_.PSIsContainer -and $_.Name -like '*.dSYM')
          }
          if ($symbols) {
            throw 'Runtime GUI output still contains debug symbols.'
          }

          Compress-Archive -Path outputGUI/* -DestinationPath GUI-win-x64.zip -Force
          if ((Get-Item GUI-win-x64.zip).Length -le 0) {
            throw 'GUI archive is empty.'
          }

      - name: Upload validated GUI archive
        uses: actions/upload-artifact@v7
        with:
          name: release-win-x64-gui
          path: GUI-win-x64.zip
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish 4.1.x GUI release
    needs: build
    runs-on: ubuntu-latest
    environment: scoop-bucket

    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref_name == 'perf/4.1-native-hwaccel'
    permissions:
      contents: write

    steps:
      - name: Download validated GUI archive
        uses: actions/download-artifact@v8
        with:
          name: release-win-x64-gui
          path: release-assets

      - name: Validate release archive
        shell: bash
        run: |
          set -euo pipefail
          archive='release-assets/GUI-win-x64.zip'
          test -s "$archive"
          unzip -Z1 "$archive" | grep -Eq '(^|/)VDF\.GUI\.exe$'
          if unzip -Z1 "$archive" | grep -Eiq '\.(pdb|dbg)$|\.dSYM/'; then
            echo 'GUI-win-x64.zip contains debug symbols.' >&2
            exit 1
          fi

      - name: Move rolling 4.1.x tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method PATCH \
            "repos/${GITHUB_REPOSITORY}/git/refs/tags/4.1.x" \
            -f sha="${GITHUB_SHA}" \
            -F force=true

      - name: Publish fork 4.1.x release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ github.token }}
          tag_name: 4.1.x
          files: release-assets/GUI-win-x64.zip
          fail_on_unmatched_files: true
          body: |
            Daily Windows x64 GUI-only Native AOT performance build from perf/4.1-native-hwaccel.

            Includes the upstream 4.1 interface and drive-aware scanner plus native batched FFmpeg extraction, D3D11 gray-byte acceleration, capability-scoped hardware fallback, multi-sample pHash matching, comparer correctness fixes, upstream decoder-safety parity, and combined gray+AI process fallback.

            This release intentionally publishes only GUI-win-x64.zip. CLI, Web, bundles, symbols, and the retired full Scoop package are not produced.

            Last build based on ${{ github.sha }}

      - name: Remove stale release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r asset; do
            if [ "$asset" != 'GUI-win-x64.zip' ]; then
              gh release delete-asset 4.1.x "$asset" --yes
            fi
          done < <(gh release view 4.1.x --json assets --jq '.assets[].name')

      - name: Trigger Scoop Excavator
        env:
          GH_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN || secrets.GH_PAT || secrets.PAT }}
        shell: bash
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo 'No cross-repository token configured; Scoop Excavator will pick up the release on its schedule.'
            exit 0
          fi
          gh workflow run excavator.yml --repo marcmy/scoop-bucket --ref master
