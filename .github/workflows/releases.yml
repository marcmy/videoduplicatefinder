name: Build GUI releases

on:
  workflow_dispatch:
  push:
    branches:
      - perf/native-hwaccel-from-crashfix
    paths-ignore:
      - 'README.md'
      - 'docs/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-gui:
    name: Build and test Windows GUI
    runs-on: windows-2022
    env:
      TARGET: win-x64

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Verify perf branch code is present
        shell: pwsh
        run: |
          $src = Get-Content VDF.Core/FFTools/FfmpegEngine.cs -Raw
          if ($src -notlike '*d3d11-video-processor-gray32*') {
            throw "Perf D3D11 graybyte fast path missing from checked-out source."
          }

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Run core unit tests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force TestResults/Core | Out-Null
          dotnet test VDF.Core.Tests/VDF.Core.Tests.csproj `
            -c Release `
            -v q `
            --logger "trx;LogFileName=core-tests.trx" `
            --results-directory TestResults/Core *>&1 |
            Tee-Object -FilePath TestResults/Core/core-tests.log
          exit $LASTEXITCODE

      - name: Install FFmpeg
        shell: pwsh
        run: choco install ffmpeg -y --no-progress

      - name: Run FFmpeg integration tests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force TestResults/Integration | Out-Null
          dotnet test VDF.IntegrationTests/VDF.IntegrationTests.csproj `
            -c Release `
            -v normal `
            --logger "trx;LogFileName=integration-tests.trx" `
            --results-directory TestResults/Integration *>&1 |
            Tee-Object -FilePath TestResults/Integration/integration-tests.log
          exit $LASTEXITCODE

      - name: Publish Native AOT GUI
        shell: pwsh
        run: |
          dotnet publish VDF.GUI/VDF.GUI.csproj `
            -c Release `
            -v q `
            -p:PublishAot=true `
            -r $env:TARGET `
            -o outputGUI
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package GUI-win-x64.zip
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'outputGUI/VDF.GUI.exe'
          if (!(Test-Path -LiteralPath $exe -PathType Leaf)) {
            throw "Native AOT publish did not produce VDF.GUI.exe."
          }

          Get-ChildItem outputGUI -Recurse -File |
            Where-Object Extension -in '.pdb', '.dbg' |
            Remove-Item -Force

          Get-ChildItem outputGUI -Recurse -Directory -Filter '*.dSYM' |
            Remove-Item -Recurse -Force

          $symbols = Get-ChildItem outputGUI -Recurse |
            Where-Object { (!$_.PSIsContainer -and $_.Extension -in '.pdb', '.dbg') -or ($_.PSIsContainer -and $_.Name -like '*.dSYM') }
          if ($symbols) {
            throw "Runtime GUI output still contains debug symbols."
          }

          7z a -tzip "GUI-$env:TARGET.zip" ".\outputGUI\*"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $archive = Get-Item "GUI-$env:TARGET.zip"
          if ($archive.Length -le 0) {
            throw "GUI archive is empty."
          }

      - name: Upload validated Windows GUI archive
        uses: actions/upload-artifact@v7
        with:
          name: release-win-x64-gui
          path: GUI-win-x64.zip
          if-no-files-found: error
          retention-days: 1

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-gui-test-results
          path: TestResults
          if-no-files-found: warn
          retention-days: 7

  build-other-gui:
    name: Build ${{ matrix.label }} GUI
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x64
            runner: ubuntu-24.04
            target: linux-x64
            archive: GUI-linux-x64.zip
          - label: macOS x64
            runner: macos-15-intel
            target: osx-x64
            archive: GUI-osx-x64.zip
          - label: macOS ARM64
            runner: macos-14
            target: osx-arm64
            archive: GUI-osx-arm64.zip

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Install Linux Native AOT dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev

      - name: Publish Native AOT GUI
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail

          dotnet publish VDF.GUI/VDF.GUI.csproj \
            -c Release \
            -v q \
            -p:PublishAot=true \
            -r "$TARGET" \
            -o outputGUI

          test -f outputGUI/VDF.GUI

      - name: Package GUI archive
        shell: bash
        env:
          ARCHIVE: ${{ matrix.archive }}
        run: |
          set -euo pipefail

          find outputGUI -type f \( -name '*.pdb' -o -name '*.dbg' \) -delete
          find outputGUI -type d -name '*.dSYM' -prune -exec rm -rf {} +

          if find outputGUI \( -type f \( -name '*.pdb' -o -name '*.dbg' \) -o -type d -name '*.dSYM' \) | grep -q .; then
            echo "Runtime GUI output still contains debug symbols." >&2
            exit 1
          fi

          (cd outputGUI && zip -r "../$ARCHIVE" .)
          test -s "$ARCHIVE"

      - name: Upload validated GUI archive
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}-gui
          path: ${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish GUI release
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref_name == 'perf/native-hwaccel-from-crashfix'
    needs:
      - build-windows-gui
      - build-other-gui
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download validated GUI archives
        uses: actions/download-artifact@v8
        with:
          pattern: release-*-gui
          path: release-assets
          merge-multiple: true

      - name: Validate release archives
        shell: bash
        run: |
          set -euo pipefail

          declare -A expected_entry=(
            ["GUI-win-x64.zip"]="VDF.GUI.exe"
            ["GUI-linux-x64.zip"]="VDF.GUI"
            ["GUI-osx-x64.zip"]="VDF.GUI"
            ["GUI-osx-arm64.zip"]="VDF.GUI"
          )

          for archive_name in "${!expected_entry[@]}"; do
            archive="release-assets/$archive_name"
            test -s "$archive"

            if ! unzip -Z1 "$archive" | grep -Eq "(^|/)${expected_entry[$archive_name]}$"; then
              echo "$archive_name does not contain ${expected_entry[$archive_name]}." >&2
              exit 1
            fi

            if unzip -Z1 "$archive" | grep -Eiq '\.(pdb|dbg)$|\.dSYM/'; then
              echo "$archive_name contains debug symbols." >&2
              exit 1
            fi

            unzip -l "$archive"
          done

      - name: Publish GUI archives
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          short_sha="${GITHUB_SHA::7}"
          cat > release-notes.md <<EOF
          Note: These are daily builds. Attachments are automatically created and replaced on every new commit. Regardless of what the message above says. If you experience upgrade issues you may need to delete your 'ScannedFiles.db' file in VDF folder.

          4.0 highlights: .NET 10, Avalonia 12, ImageSharp removed (all image processing now via FFmpeg), faster duplicate comparison. Your scan database is migrated automatically on first load; cached image hashes are recomputed on the next scan (videos are unaffected). Downgrading to 3.0.x after that migration is not recommended.

          GUI-only Native AOT builds from perf/native-hwaccel-from-crashfix:
          - Windows x64
          - Linux x64
          - macOS x64
          - macOS ARM64

          This release intentionally no longer publishes CLI, Web, symbol, or full-bundle assets.

          Last build based on $short_sha
          EOF

          allowed_assets=$'GUI-win-x64.zip\nGUI-linux-x64.zip\nGUI-osx-x64.zip\nGUI-osx-arm64.zip'

          if gh release view 4.0.x >/dev/null 2>&1; then
            gh release upload 4.0.x release-assets/GUI-*.zip --clobber
            gh release edit 4.0.x --notes-file release-notes.md

            while IFS= read -r asset; do
              if ! grep -Fxq "$asset" <<< "$allowed_assets"; then
                gh release delete-asset 4.0.x "$asset" --yes
              fi
            done < <(gh release view 4.0.x --json assets --jq '.assets[].name')
          else
            gh release create 4.0.x release-assets/GUI-*.zip \
              --target "$GITHUB_SHA" \
              --title "4.0.x" \
              --notes-file release-notes.md
          fi

      - name: Trigger Scoop bucket Excavator
        env:
          GH_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN || secrets.GH_PAT || secrets.PAT }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GH_TOKEN)) {
            Write-Host "No cross-repo token secret configured; skipping scoop-bucket Excavator trigger. Add SCOOP_BUCKET_TOKEN, GH_PAT, or PAT with repo/workflow access to enable this."
            exit 0
          }
          gh workflow run excavator.yml --repo marcmy/scoop-bucket --ref master
