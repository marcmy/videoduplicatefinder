name: Build 4.1 performance release

on:
  workflow_dispatch:
  push:
    branches:
      - perf/4.1-native-hwaccel
    paths-ignore:
      - '.github/workflows/**'
      - 'README.md'
      - 'docs/**'

permissions:
  contents: read

concurrency:
  group: vdf-4.1-performance-release
  cancel-in-progress: true

jobs:
  build:
    name: Build and validate Windows GUI
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Verify native performance engine
        shell: pwsh
        run: |
          $src = Get-Content VDF.Core/FFTools/FfmpegEngine.cs -Raw
          if ($src -notlike '*d3d11-video-processor-gray32*') {
            throw 'Native D3D11 gray-byte fast path is missing from the checked-out source.'
          }
          if ($src -notlike '*capability-bypass*') {
            throw 'Capability-scoped hardware fallback logic is missing from the checked-out source.'
          }

      - name: Run Core tests
        run: dotnet test VDF.Core.Tests/VDF.Core.Tests.csproj -c Release -v q

      - name: Install FFmpeg
        run: choco install ffmpeg -y --no-progress

      - name: Run FFmpeg integration tests
        run: dotnet test VDF.IntegrationTests/VDF.IntegrationTests.csproj -c Release -v normal

      - name: Publish Windows x64 GUI Native AOT
        run: dotnet publish VDF.GUI/VDF.GUI.csproj -c Release -v q -p:PublishAot=true -r win-x64 -o outputGUI

      - name: Verify package
        shell: pwsh
        run: |
          if (-not (Test-Path outputGUI/VDF.GUI.exe)) {
            throw 'Native AOT publish did not produce VDF.GUI.exe.'
          }
          Get-ChildItem outputGUI -Recurse | Where-Object {
            $_.Extension -in '.pdb', '.dbg', '.dSYM'
          } | ForEach-Object {
            throw "Runtime package contains a symbol file: $($_.FullName)"
          }
          Compress-Archive -Path outputGUI/* -DestinationPath GUI-win-x64.zip -Force

      - name: Upload GUI package
        uses: actions/upload-artifact@v7
        with:
          name: GUI-win-x64
          path: GUI-win-x64.zip
          if-no-files-found: error
          retention-days: 3

  publish:
    name: Publish GUI release
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/perf/4.1-native-hwaccel' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: write
    steps:
      - name: Download GUI package
        uses: actions/download-artifact@v8
        with:
          name: GUI-win-x64

      - name: Publish 4.1.x release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ github.token }}
          tag_name: 4.1.x
          files: GUI-win-x64.zip
          fail_on_unmatched_files: true
          body: |
            Daily Windows x64 performance build based on the 4.1 interface and scan architecture.

            Includes native batched FFmpeg frame extraction, D3D11 gray-byte acceleration,
            capability-scoped hardware fallback, drive-aware media scanning, and reserved CPU
            headroom during duplicate matching.

            The asset is replaced on each successful branch update.

      - name: Trigger Scoop Excavator
        env:
          GH_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN || secrets.GH_PAT || secrets.PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo 'No cross-repository token configured; skipping Scoop Excavator dispatch.'
            exit 0
          fi
          gh workflow run excavator.yml --repo marcmy/scoop-bucket --ref master
