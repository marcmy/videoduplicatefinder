name: Inspect live release hashes

on:
  pull_request:
    paths:
      - '.github/workflows/inspect-release-hashes.yml'

permissions:
  contents: read

jobs:
  hashes:
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir release
          gh release download 4.0.x \
            --repo "$GITHUB_REPOSITORY" \
            --pattern '*-win-x64.zip' \
            --dir release
          sha256sum release/* | tee release-hashes.txt
          ls -lh release

      - name: Upload hashes
        uses: actions/upload-artifact@v4
        with:
          name: live-release-hashes
          path: release-hashes.txt
          if-no-files-found: error
          retention-days: 1
