name: Apply 4.1 comparer correctness port

on:
  push:
    branches:
      - perf/4.1-native-hwaccel
    paths:
      - .github/workflows/port-41-comparer-correctness.yml

permissions:
  contents: write
  pull-requests: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: perf/4.1-native-hwaccel
          fetch-depth: 0

      - name: Fetch reference branch
        run: git fetch origin perf/native-hwaccel-from-crashfix

      - name: Apply comparer correctness fixes
        run: python tools/port-41-comparer-correctness.py

      - name: Build GUI
        run: dotnet build VDF.GUI/VDF.GUI.csproj -c Release -v q

      - name: Test GUI
        id: tests
        shell: bash
        run: |
          set +e
          dotnet test VDF.GUI.Tests/VDF.GUI.Tests.csproj -c Release -v q --logger "trx;LogFileName=gui.trx"
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Report exact GUI test failure
        if: steps.tests.outputs.code != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          from pathlib import Path
          import os
          import subprocess
          import xml.etree.ElementTree as ET

          trx = next(Path('VDF.GUI.Tests/TestResults').rglob('gui.trx'))
          root = ET.parse(trx).getroot()
          ns = {'t': 'http://microsoft.com/schemas/VisualStudio/TeamTest/2010'}
          failures = []
          for result in root.findall('.//t:UnitTestResult', ns):
              if result.attrib.get('outcome') != 'Failed':
                  continue
              name = result.attrib.get('testName', '(unknown test)')
              message = result.findtext('t:Output/t:ErrorInfo/t:Message', default='', namespaces=ns).strip()
              stack = result.findtext('t:Output/t:ErrorInfo/t:StackTrace', default='', namespaces=ns).strip()
              failures.append(f"**{name}**\n\n```text\n{message}\n{stack}\n```")
          body = '### Comparer correctness GUI test failure\n\n' + ('\n\n'.join(failures) if failures else 'TRX contained no failed test result.')
          subprocess.run([
              'gh', 'api', 'repos/marcmy/videoduplicatefinder/issues/comments/4909781594',
              '-X', 'PATCH', '-f', f'body={body}'
          ], check=True, env={**os.environ, 'GH_TOKEN': os.environ['GH_TOKEN']})
          raise SystemExit(1)

      - name: Commit comparer fixes
        if: steps.tests.outputs.code == '0'
        shell: bash
        run: |
          rm -f .github/workflows/port-41-comparer-correctness.yml tools/port-41-comparer-correctness.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: preserve comparer frame and zoom correctness on 4.1"
          git push origin HEAD:perf/4.1-native-hwaccel
