name: Finalize 4.1 engine and comparer integration

on:
  push:
    branches:
      - perf/4.1-native-hwaccel
    paths:
      - .github/workflows/port-41-comparer-correctness.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
        with:
          ref: perf/4.1-native-hwaccel
          fetch-depth: 0

      - name: Fetch reference branch
        shell: pwsh
        run: git fetch origin perf/native-hwaccel-from-crashfix

      - name: Apply comparer correctness fixes
        shell: pwsh
        run: python tools/port-41-comparer-correctness.py

      - name: Wire scan parallelism into D3D11 tuning
        shell: python
        run: |
          from pathlib import Path
          path = Path('VDF.Core/ScanEngine.cs')
          text = path.read_text(encoding='utf-8')
          old = '\t\t\tFfmpegEngine.UseNativeBinding = Settings.UseNativeFfmpegBinding;\n'
          new = old + (
              '\t\t\tFfmpegEngine.ScanMaxDegreeOfParallelism = Settings.MaxDegreeOfParallelism;\n'
              '\t\t\tFfmpegEngine.ConfigureNativeGrayByteD3D11Concurrency();\n'
          )
          if text.count(old) != 1:
              raise RuntimeError(f'expected one FFmpeg scan setup anchor, found {text.count(old)}')
          if 'FfmpegEngine.ScanMaxDegreeOfParallelism = Settings.MaxDegreeOfParallelism;' not in text:
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

      - name: Align 4.1 release branch and tag
        shell: python
        run: |
          from pathlib import Path
          path = Path('.github/workflows/releases.yml')
          text = path.read_text(encoding='utf-8')
          old_branch = 'perf/native-hwaccel-from-crashfix'
          old_tag = '4.0.x'
          if old_branch not in text:
              raise RuntimeError('old perf branch reference not found in releases.yml')
          if old_tag not in text:
              raise RuntimeError('old 4.0.x release tag not found in releases.yml')
          text = text.replace(old_branch, 'perf/4.1-native-hwaccel')
          text = text.replace(old_tag, '4.1.x')
          path.write_text(text, encoding='utf-8')

      - name: Build GUI
        shell: pwsh
        run: dotnet build VDF.GUI/VDF.GUI.csproj -c Release -v q

      - name: Run Core tests
        shell: pwsh
        run: dotnet test VDF.Core.Tests/VDF.Core.Tests.csproj -c Release -v q

      - name: Run GUI tests
        shell: pwsh
        run: dotnet test VDF.GUI.Tests/VDF.GUI.Tests.csproj -c Release -v q

      - name: Commit finalized port
        shell: pwsh
        run: |
          Remove-Item -Force .github/workflows/port-41-comparer-correctness.yml
          Remove-Item -Force tools/port-41-comparer-correctness.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: finalize 4.1 native engine integration'
          git push origin HEAD:perf/4.1-native-hwaccel
