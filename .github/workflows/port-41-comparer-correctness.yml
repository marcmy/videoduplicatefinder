name: Apply 4.1 comparer correctness port

on:
  push:
    branches:
      - perf/4.1-native-hwaccel
    paths:
      - .github/workflows/port-41-comparer-correctness.yml

permissions:
  contents: write
  pull-requests: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: perf/4.1-native-hwaccel
          fetch-depth: 0

      - name: Fetch reference branch
        run: git fetch origin perf/native-hwaccel-from-crashfix

      - name: Apply comparer correctness fixes
        shell: bash
        run: python tools/port-41-comparer-correctness.py

      - name: Build GUI
        run: dotnet build VDF.GUI/VDF.GUI.csproj -c Release -v q

      - name: Test GUI
        run: dotnet test VDF.GUI.Tests/VDF.GUI.Tests.csproj -c Release -v q

      - name: Commit comparer fixes
        shell: bash
        run: |
          rm -f .github/workflows/port-41-comparer-correctness.yml tools/port-41-comparer-correctness.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: preserve comparer frame and zoom correctness on 4.1"
          git push origin HEAD:perf/4.1-native-hwaccel
