name: Supply-chain audit

on:
  pull_request:
    branches:
      - master

permissions: {}

jobs:
  cleanup-obsolete-workflow-history:
    name: Remove obsolete workflow history
    if: github.head_ref == 'cleanup/obsolete-actions-sidebar'
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Delete retired workflow runs
        shell: bash
        run: |
          set -euo pipefail

          declare -A targets=(
            ["Apply 4.1 comparer correctness port"]=1
            ["Apply 4.1 matching headroom port"]=1
            ["Apply 4.1 pHash sample quorum port"]=1
            ["Apply RGB224 compatibility fix"]=1
            ["Build 4.1 performance release"]=1
            ["Capture 4.1 release hash"]=1
            ["Refresh 4.1 perf branch"]=1
          )

          mapfile -t runs < <(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" \
              --jq '.workflow_runs[] | [.id, .name, .path] | @tsv'
          )

          deleted=0
          failed=0

          for row in "${runs[@]}"; do
            IFS=$'\t' read -r run_id workflow_name workflow_path <<< "$row"
            [[ -n "${targets[$workflow_name]+present}" ]] || continue

            echo "Deleting ${workflow_name}: run ${run_id}"
            if gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}"; then
              deleted=$((deleted + 1))
            else
              failed=$((failed + 1))
            fi
          done

          remaining=0
          mapfile -t remaining_runs < <(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" \
              --jq '.workflow_runs[] | [.id, .name, .path] | @tsv'
          )

          for row in "${remaining_runs[@]}"; do
            IFS=$'\t' read -r run_id workflow_name workflow_path <<< "$row"
            if [[ -n "${targets[$workflow_name]+present}" ]]; then
              echo "Still present: ${workflow_name}: run ${run_id}" >&2
              remaining=$((remaining + 1))
            fi
          done

          echo "Deleted obsolete runs: ${deleted}"
          echo "Failed deletions: ${failed}"
          echo "Remaining obsolete runs: ${remaining}"

          if (( failed > 0 || remaining > 0 )); then
            exit 1
          fi

      - name: Delete temporary cleanup branch
        if: always()
        shell: bash
        run: |
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/cleanup/obsolete-actions-sidebar"
