name: Supply-chain audit

on:
  pull_request:
    branches:
      - master

permissions: {}

jobs:
  inspect-obsolete-workflows:
    name: Inspect remaining sidebar workflows
    if: github.head_ref == 'cleanup/obsolete-actions-sidebar-v3'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Print workflow records and remaining run counts
        shell: bash
        run: |
          set -euo pipefail

          declare -A targets=(
            ["Apply 4.1 comparer correctness port"]=1
            ["Apply 4.1 matching headroom port"]=1
            ["Apply 4.1 pHash sample quorum port"]=1
            ["Build 4.1 performance release"]=1
            ["Capture 4.1 release hash"]=1
            ["Refresh 4.1 perf branch"]=1
          )

          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/workflows?per_page=100" \
            --jq '.workflows[] | [.id, .name, .path, .state] | @tsv' |
          while IFS=$'\t' read -r workflow_id workflow_name workflow_path workflow_state; do
            [[ -n "${targets[$workflow_name]+present}" ]] || continue
            count=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_id}/runs?per_page=1" --jq '.total_count')
            printf 'WORKFLOW\t%s\t%s\t%s\t%s\tRUNS=%s\n' "$workflow_id" "$workflow_name" "$workflow_path" "$workflow_state" "$count"
          done

      - name: Delete temporary inspection branch
        if: always()
        shell: bash
        run: |
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/cleanup/obsolete-actions-sidebar-v3"
