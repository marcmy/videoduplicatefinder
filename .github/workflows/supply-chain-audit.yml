name: Supply-chain audit

on:
  pull_request:
    branches:
      - master

permissions: {}

jobs:
  cleanup-obsolete-workflow-history:
    name: Remove obsolete workflow history by workflow ID
    if: github.head_ref == 'cleanup/obsolete-actions-sidebar-v2'
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Remove every run attached to obsolete workflow records
        shell: bash
        run: |
          set -euo pipefail

          declare -A targets=(
            ["Apply 4.1 comparer correctness port"]=1
            ["Apply 4.1 matching headroom port"]=1
            ["Apply 4.1 pHash sample quorum port"]=1
            ["Build 4.1 performance release"]=1
            ["Capture 4.1 release hash"]=1
            ["Refresh 4.1 perf branch"]=1
          )

          mapfile -t workflows < <(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/workflows?per_page=100" \
              --jq '.workflows[] | [.id, .name, .path, .state] | @tsv'
          )

          matched=0
          deleted=0
          remaining=0

          for row in "${workflows[@]}"; do
            IFS=$'\t' read -r workflow_id workflow_name workflow_path workflow_state <<< "$row"
            [[ -n "${targets[$workflow_name]+present}" ]] || continue

            matched=$((matched + 1))
            echo "Workflow ${workflow_id}: ${workflow_name} | ${workflow_path} | ${workflow_state}"

            mapfile -t run_ids < <(
              gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_id}/runs?per_page=100" \
                --jq '.workflow_runs[].id'
            )

            echo "Found ${#run_ids[@]} run(s) on workflow ${workflow_id}."
            for run_id in "${run_ids[@]}"; do
              echo "Deleting run ${run_id} from workflow ${workflow_id}"
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}"
              deleted=$((deleted + 1))
            done

            left=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_id}/runs?per_page=1" --jq '.total_count')
            echo "Remaining runs on workflow ${workflow_id}: ${left}"
            remaining=$((remaining + left))
          done

          echo "Matched obsolete workflow records: ${matched}"
          echo "Deleted runs: ${deleted}"
          echo "Remaining runs: ${remaining}"

          if (( matched == 0 || remaining > 0 )); then
            exit 1
          fi

      - name: Delete temporary cleanup branch
        if: always()
        shell: bash
        run: |
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/cleanup/obsolete-actions-sidebar-v2"
