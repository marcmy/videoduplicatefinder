name: Dispatch VDF perf release

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/dispatch-vdf-perf-release.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Dispatch missing VDF perf release build'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Build releases on perf branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run releases.yml --repo "${{ github.repository }}" --ref perf/native-hwaccel-from-crashfix
