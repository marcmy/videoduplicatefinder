version: 2
updates:
  - package-ecosystem: "nuget"
    directories:
      - "/FakeDatabaseGenerator"
      - "/VDF.Benchmarks"
      - "/VDF.CLI.Tests"
      - "/VDF.CLI"
      - "/VDF.Core.Tests"
      - "/VDF.Core"
      - "/VDF.GUI.Tests"
      - "/VDF.GUI"
      - "/VDF.IntegrationTests"
      - "/VDF.TestSupport"
      - "/VDF.Web.Tests"
      - "/VDF.Web"
    schedule:
      interval: "weekly"
      day: "thursday"
      time: "18:00"
      timezone: "America/New_York"
    # ONNX Runtime 1.24+ no longer ships osx-x86_64 release archives.
    # VDF still targets Intel macOS, and AiComponents downloads those archives
    # directly, so keep the managed wrapper and test runtime on the 1.23.x line.
    ignore:
      - dependency-name: "Microsoft.ML.OnnxRuntime"
        versions: ["[1.24.0,)"]
      - dependency-name: "Microsoft.ML.OnnxRuntime.Managed"
        versions: ["[1.24.0,)"]

  - package-ecosystem: "docker"
    directories:
      - "/VDF.CLI"
      - "/VDF.Web"
    schedule:
      interval: "weekly"
      day: "thursday"
      time: "18:00"
      timezone: "America/New_York"

  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "thursday"
      time: "18:00"
      timezone: "America/New_York"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/New_York"
