version: 2
updates:
  - package-ecosystem: "nuget"
    directories:
      - "/FakeDatabaseGenerator"
      - "/VDF.Benchmarks"
      - "/VDF.CLI.Tests"
      - "/VDF.CLI"
      - "/VDF.Core.Tests"
      - "/VDF.Core"
      - "/VDF.GUI.Tests"
      - "/VDF.GUI.HeadlessTests"
      - "/VDF.GUI"
      - "/VDF.IntegrationTests"
      - "/VDF.TestSupport"
      - "/VDF.Web.Tests"
      - "/VDF.Web"
    schedule:
      interval: "daily"
      time: "12:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 100
    cooldown:
      default-days: 7
    # VDF.GUI pins managed SkiaSharp and the Linux native assets to the same
    # version; update them together so they never land out of step.
    groups:
      skiasharp:
        patterns:
          - "SkiaSharp*"
      # Avalonia's packages are released in lockstep and must match each other.
      avalonia:
        patterns:
          - "Avalonia"
          - "Avalonia.*"
    # Temporarily keep the managed wrapper and test runtime on the 1.23.x line:
    # Windows currently downloads ONNX Runtime DirectML 1.23.0 separately.
    # Upgrade these packages together with the native CPU/DirectML runtimes
    # (and verify AI inference) before allowing Dependabot to update them.
    ignore:
      - dependency-name: "Microsoft.ML.OnnxRuntime"
        versions: [">= 1.24.0"]
      - dependency-name: "Microsoft.ML.OnnxRuntime.Managed"
        versions: [">= 1.24.0"]
      # ReactiveUI 12.1+ splits the Rx API into separate namespaces/packages.
      # Defer minor/major updates until view-model and binding migration is tested.
      # Allow 12.0.x patch updates to continue.
      - dependency-name: "ReactiveUI.Avalonia"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

  - package-ecosystem: "docker"
    directories:
      - "/VDF.CLI"
      - "/VDF.Web"
    schedule:
      interval: "daily"
      time: "12:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 100
    cooldown:
      default-days: 7

  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "daily"
      time: "12:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 100
    cooldown:
      default-days: 7

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "12:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 100
    cooldown:
      default-days: 7
